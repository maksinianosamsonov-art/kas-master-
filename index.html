        const CuttingOptimizer = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            const [parts, setParts] = useState([
                { id: 1, name: 'Деталь A', length: 2400, width: 500, height: 400, quantity: 4, color: 'bg-blue-500' },
                { id: 2, name: 'Деталь B', length: 850, width: 800, height: 600, quantity: 6, color: 'bg-emerald-500' },

            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            const addPart = () => {
                const newId = parts.length > 0 ? Math.max(...parts.map(p => p.id)) + 1 : 1;
                setParts([...parts, { id: newId, name: `Деталь ${newId}`, length: 1000, width: 400, height: 300, quantity: 1, color: colors[newId % colors.length] }]);
            };

            const clearAllParts = () => {
                if (parts.length > 0 && window.confirm("Вы действительно хотите удалить все детали?")) {
                    setParts([]);
                }
            };

            const removePart = (id) => setParts(parts.filter(p => p.id !== id));
            const updatePart = (id, field, value) => setParts(parts.map(p => p.id === id ? { ...p, [field]: value } : p));

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                let currentMaxId = parts.length > 0 ? Math.max(...parts.map(p => p.id)) : 0;
                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));
                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: currentMaxId + 1 + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: currentMaxId + 1 + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });
                if (newParts.length > 0) {
                    setParts([...parts, ...newParts]);
                    setImportText('');
                    setShowImport(false);
                } else {
                    alert('Не удалось распознать данные. Проверьте формат.');
                }
            };

            const calculateLinear = () => {
                let allPieces = [];
                parts.forEach(part => { for (let i = 0; i < part.quantity; i++) allPieces.push({ ...part }); });
                allPieces.sort((a, b) => b.length - a.length);
                if (allPieces.some(p => p.length > stockLength)) { alert("Ошибка: Деталь длиннее заготовки!"); return; }
                let bars = [];
                allPieces.forEach(piece => {
                    let bestBarIndex = -1;
                    let minWaste = Infinity;
                    for (let i = 0; i < bars.length; i++) {
                        const neededSpace = bars[i].parts.length > 0 ? piece.length + bladeWidth : piece.length;
                        if (bars[i].remaining >= neededSpace) {
                            const waste = bars[i].remaining - neededSpace;
                            if (waste < minWaste) { minWaste = waste; bestBarIndex = i; }
                        }
                    }
                    if (bestBarIndex !== -1) {
                        const bar = bars[bestBarIndex];
                        const isFirst = bar.parts.length === 0;
                        const used = isFirst ? piece.length : piece.length + bladeWidth;
                        bar.parts.push(piece);
                        bar.remaining -= used;
                        bar.usedLength += used;
                    } else {
                        bars.push({ id: bars.length + 1, parts: [piece], remaining: stockLength - piece.length, usedLength: piece.length, totalLength: stockLength });
                    }
                });
                setResults(bars);
                setSheetResults(null);
                setOptimizationLog("Использован алгоритм First Fit Decreasing (FFD).");
            };

            const calculateSheet = () => {
                let rawRects = [];
                parts.forEach(part => { for (let i = 0; i < part.quantity; i++) { rawRects.push({ ...part, uniqueId: `${part.id}-${i}` }); } });
                if (rawRects.some(p => Math.min(p.width, p.height) > Math.min(stockSize.w, stockSize.h) && Math.max(p.width, p.height) > Math.max(stockSize.w, stockSize.h))) { alert("Ошибка: Деталь больше размера листа!"); return; }
                const strategies = [{ name: "По площади", sort: (a, b) => (b.width * b.height) - (a.width * a.height) }, { name: "По длинной стороне", sort: (a, b) => Math.max(b.width, b.height) - Math.max(a.width, a.height) }];
                let bestSolution = null; let bestEfficiency = -1;
                strategies.forEach(strat => {
                    let sortedRects = [...rawRects].sort(strat.sort);
                    let currentSheets = [];
                    let remainingParts = [...sortedRects];
                    let sheetId = 1;
                    while (remainingParts.length > 0) {
                        const { placedParts, packedIndices } = packOneSheet(remainingParts, stockSize, bladeWidth, allowRotation);
                        if (placedParts.length === 0) break;
                        currentSheets.push({ id: sheetId++, parts: placedParts });
                        remainingParts = remainingParts.filter((_, i) => !packedIndices.has(i));
                    }
                    const totalArea = currentSheets.length * stockSize.w * stockSize.h;
                    const usedArea = currentSheets.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    const efficiency = totalArea > 0 ? usedArea / totalArea : 0;
                    if (efficiency > bestEfficiency) { bestEfficiency = efficiency; bestSolution = currentSheets; }
                });
                setSheetResults(bestSolution); setResults(null); setOptimizationLog(`Оптимизация завершена. КПД: ${(bestEfficiency * 100).toFixed(1)}%`);
            };

            const packOneSheet = (remainingRects, stock, kerf, rotate) => {
                let freeRects = [{ x: 0, y: 0, w: stock.w, h: stock.h }];
                let placedParts = [];
                let packedIndices = new Set();
                const splitFreeRect = (free, placedX, placedY, placedW, placedH) => {
                    const newFree = [];
                    const rightX = placedX + placedW + kerf; const bottomY = placedY + placedH + kerf;
                    if (rightX < free.x + free.w) newFree.push({ x: rightX, y: free.y, w: free.x + free.w - rightX, h: free.h });
                    if (bottomY < free.y + free.h) newFree.push({ x: free.x, y: bottomY, w: Math.min(placedW, free.w), h: free.y + free.h - bottomY });
                    return newFree;
                };
                for (let i = 0; i < remainingRects.length; i++) {
                    if (packedIndices.has(i)) continue;
                    const part = remainingRects[i];
                    let bestScore = Infinity; let bestPlacement = null; let bestNewFree = null;
                    for (let f = 0; f < freeRects.length; f++) {
                        const free = freeRects[f];
                        if (part.width <= free.w && part.height <= free.h) {
                            const score = (free.w - part.width) * (free.h - part.height);
                            if (score < bestScore) { bestScore = score; bestPlacement = { rectIndex: f, rotated: false, x: free.x, y: free.y, w: part.width, h: part.height }; bestNewFree = splitFreeRect(free, free.x, free.y, part.width, part.height); }
                        }
                        if (rotate && part.height <= free.w && part.width <= free.h) {
                            const score = (free.w - part.height) * (free.h - part.width);
                            if (score < bestScore) { bestScore = score; bestPlacement = { rectIndex: f, rotated: true, x: free.x, y: free.y, w: part.height, h: part.width }; bestNewFree = splitFreeRect(free, free.x, free.y, part.height, part.width); }
                        }
                    }
                    if (bestPlacement) {
                        const { rectIndex, rotated, x, y, w, h } = bestPlacement;
                        placedParts.push({ ...part, x, y, currentW: w, currentH: h, rotated });
                        packedIndices.add(i);
                        freeRects.splice(rectIndex, 1); freeRects.push(...bestNewFree);
                        freeRects = freeRects.filter((a, idx) => {
                            if (a.w <= 0 || a.h <= 0) return false;
                            for (let j = 0; j < freeRects.length; j++) { if (j !== idx) { const b = freeRects[j]; if (a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h) return false; } }
                            return true;
                        });
                    }
                }
                return { placedParts, packedIndices };
            };

                    return { totalItems: results.length, efficiency, waste: wasteVal.toFixed(0), unit: 'мм', areaUnit: 'м', totalCost: totalCost.toFixed(0), wasteCost: wasteCost.toFixed(0), hasPrice: materialPrice > 0 };

                    return { totalItems: sheetResults.length, efficiency, waste: wasteAreaM2.toFixed(3), unit: 'мм²', areaUnit: 'м²', totalCost: totalCost.toFixed(0), wasteCost: wasteCost.toFixed(0), hasPrice: materialPrice > 0 };

                        <button onClick={() => setMode('sheet')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all ${mode === 'sheet' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}><Layers size={16} /> Листовой</button>
                    </div>
                    <div className="flex items-center gap-4 bg-slate-800 p-2 rounded-lg border border-slate-700 overflow-x-auto max-w-full">
                        {mode === 'linear' ? (<div className="flex flex-col min-w-[80px]"><label className="text-[10px] text-slate-400 uppercase font-semibold">Длина (мм)</label><input type="number" value={stockLength} onChange={(e) => setStockLength(Number(e.target.value))} className="bg-transparent text-white font-mono font-bold w-full focus:outline-none"/></div>) : (<React.Fragment><div className="flex flex-col w-20"><label className="text-[10px] text-slate-400 uppercase font-semibold">Ширина</label><input type="number" value={stockSize.w} onChange={(e) => setStockSize({...stockSize, w: Number(e.target.value)})} className="bg-transparent text-white font-mono font-bold w-full focus:outline-none"/></div><div className="w-px h-8 bg-slate-600"></div><div className="flex flex-col w-20"><label className="text-[10px] text-slate-400 uppercase font-semibold">Высота</label><input type="number" value={stockSize.h} onChange={(e) => setStockSize({...stockSize, h: Number(e.target.value)})} className="bg-transparent text-white font-mono font-bold w-full focus:outline-none"/></div></React.Fragment>)}
                        <div className="w-px h-8 bg-slate-600"></div><div className="flex flex-col w-24"><label className="text-[10px] text-slate-400 uppercase font-semibold">Ширина реза</label><input type="number" value={bladeWidth} onChange={(e) => setBladeWidth(Number(e.target.value))} className="bg-transparent text-white font-mono font-bold w-full focus:outline-none"/></div>
                        <div className="w-px h-8 bg-slate-600"></div><div className="flex flex-col w-20"><label className="text-[10px] text-emerald-400 uppercase font-semibold flex items-center gap-1">Цена {mode==='linear'?'/м':'/м²'}</label><input type="number" value={materialPrice} onChange={(e) => setMaterialPrice(Number(e.target.value))} className="bg-transparent text-white font-mono font-bold w-full focus:outline-none text-emerald-300" placeholder="0"/></div>
                    </div>
                    </div>
                </header>
                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
                    <div className="lg:col-span-1 space-y-6">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[calc(100vh-140px)] sticky top-24">
                        <div className="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center shrink-0">
                        <h2 className="font-semibold text-slate-700 flex items-center gap-2"><Settings size={18} /> Детали {mode === 'sheet' && '(мм)'}</h2>
                        <div className="flex gap-2">
                            {mode === 'sheet' && (<button onClick={() => setAllowRotation(!allowRotation)} className={`p-2 rounded-lg border transition-all shadow-sm ${allowRotation ? 'bg-indigo-600 text-white border-indigo-600 hover:bg-indigo-700' : 'bg-white text-slate-600 border-slate-300 hover:border-indigo-500 hover:text-indigo-600'}`} title="Вращение"><RotateCcw size={18} /></button>)}
                            <button onClick={() => setShowImport(!showImport)} className={`p-2 rounded-lg border transition-all shadow-sm ${showImport ? 'bg-indigo-600 text-white border-indigo-600 hover:bg-indigo-700' : 'bg-white text-slate-600 border-slate-300 hover:border-indigo-500 hover:text-indigo-600'}`} title="Импорт данных из Excel"><FileText size={18} /></button>
                            <button onClick={clearAllParts} className="p-2 rounded-lg border border-slate-300 bg-white text-red-500 hover:bg-red-50 hover:border-red-500 transition-all shadow-sm" title="Удалить все"><Trash2 size={18} /></button>
                            <button onClick={addPart} className="p-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition-colors shadow-sm"><Plus size={18} /></button>
                        </div>
                        </div>
                        {showImport ? (
                            <div className="p-4 flex-grow flex flex-col bg-slate-50/50">
                                <div className="text-xs text-slate-500 mb-2">{mode === 'linear' ? "Вставьте данные: Длина Количество" : "Вставьте данные: Ширина Высота Количество"}<br/>(Скопируйте столбцы из Excel)</div>
                                <textarea className="w-full flex-grow p-3 border border-slate-300 rounded text-sm font-mono focus:outline-none focus:border-blue-500 mb-3" placeholder={mode === 'linear' ? "Пример:\n1500 5\n2300 2" : "Пример:\n500 400 10\n1200 600 5"} value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                                <button onClick={handleImport} className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-medium shadow-sm transition-colors text-sm">Обработать и добавить</button>
                            </div>
                        ) : (
                            <div className="p-4 space-y-3 overflow-y-auto flex-grow">
                            {parts.length === 0 && (<div className="text-center py-8 text-slate-400 text-sm">Нет деталей. Добавьте первую.</div>)}
                            {parts.map((part) => (
                                <div key={part.id} className="group relative bg-white p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <div className="flex justify-between items-start mb-2"><input type="text" value={part.name} onChange={(e) => updatePart(part.id, 'name', e.target.value)} className="font-medium text-slate-700 w-full focus:outline-none focus:border-b border-blue-300 text-sm"/><button onClick={() => removePart(part.id)} className="text-slate-300 hover:text-red-500"><Trash2 size={16} /></button></div>
                                <div className="flex gap-2 items-end">
                                    {mode === 'linear' ? (<div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Длина</label><input type="number" value={part.length} onChange={(e) => updatePart(part.id, 'length', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono"/></div>) : (<React.Fragment><div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Ширина</label><input type="number" value={part.width} onChange={(e) => updatePart(part.id, 'width', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono"/></div><span className="pb-2 text-slate-300">x</span><div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Высота</label><input type="number" value={part.height} onChange={(e) => updatePart(part.id, 'height', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono"/></div></React.Fragment>)}
                                    <div className="w-16"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Кол-во</label><input type="number" value={part.quantity} onChange={(e) => updatePart(part.id, 'quantity', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono text-center"/></div>
                                </div>
                                <div className={`absolute left-0 top-0 bottom-0 w-1 rounded-l-lg ${part.color}`}></div>
                                </div>
                            ))}
                            </div>
                        )}
                        <div className="p-4 bg-slate-50 border-t border-slate-200 shrink-0">
                            <button onClick={handleCalculate} disabled={parts.length === 0} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-semibold shadow-md active:transform active:scale-95 transition-all flex justify-center items-center gap-2 disabled:opacity-50"><Calculator size={20} /> Рассчитать</button>
                            <div className="mt-3 text-center">
                                <p className="text-[10px] text-slate-400 font-medium select-all mb-2">Поддержать проект:</p>
                                <div className="flex justify-center mb-2"><img src="f72a202f-7469-4ccd-ae92-c126326506ca.jpg" alt="QR Code для пожертвования" className="w-32 h-32 object-contain border border-slate-200 rounded-lg"/></div>
                            </div>
                        </div>
                    </div>
                    </div>
                    <div className="lg:col-span-2 space-y-6">
                    
                    {/* --- ТИЗЕРНЫЙ БЛОК ВЕРХНИЙ --- */}
                    <TeaserPlaceholder id="kadam-block-top" />

                    {stats ? (
                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <StatCard label={mode === 'linear' ? "Всего хлыстов" : "Всего листов"} value={stats.totalItems} unit="шт" />
                            <StatCard label={mode === 'linear' ? "Общая длина" : "Общая площадь"} value={mode === 'linear' ? (stats.totalItems * stockLength / 1000).toFixed(1) : ((stats.totalItems * stockSize.w * stockSize.h) / 1000000).toFixed(2)} unit={stats.areaUnit} />
                            <StatCard label="Эффективность" value={stats.efficiency} unit="%" color={Number(stats.efficiency) > 85 ? 'text-emerald-600' : 'text-blue-600'} />
                            <StatCard label="Отходы" value={stats.waste} unit={mode === 'linear' ? 'мм' : 'м²'} color="text-rose-600" />
                        </div>
                        {stats.hasPrice && (
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 flex items-center justify-between"><div><div className="text-xs text-emerald-600 uppercase font-bold mb-1">Стоимость материала</div><div className="text-xl font-mono font-bold text-emerald-800">{stats.totalCost} ₽</div></div></div>
                                <div className="bg-rose-50 p-3 rounded-xl border border-rose-100 flex items-center justify-between"><div><div className="text-xs text-rose-600 uppercase font-bold mb-1">Стоимость отходов</div><div className="text-xl font-mono font-bold text-rose-800">{stats.wasteCost} ₽</div></div><div className="p-2 bg-rose-200 rounded-full text-rose-700"><Trash2 size={20}/></div></div>
                            </div>
                        )}
                        {optimizationLog && (<div className="text-[10px] text-slate-500 font-mono bg-slate-100 p-2 rounded border border-slate-200 whitespace-pre-wrap">{optimizationLog}</div>)}
                        
                        {/* --- ТИЗЕРНЫЙ БЛОК ЦЕНТРАЛЬНЫЙ --- */}
                        <TeaserPlaceholder id="kadam-block-middle" />

                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <div className="flex justify-between items-center mb-6"><h2 className="text-lg font-bold text-slate-800">Схемы {mode === 'linear' ? 'нарезки' : 'раскроя'}</h2><button onClick={() => window.print()} className="text-sm flex items-center gap-1 text-blue-600 hover:underline"><Download size={16} /> Печать</button></div>
                            <div className="space-y-8">
                            {mode === 'linear' && results && results.map((bar, index) => (
                                <div key={bar.id} className="relative print-break-inside-avoid">
                                <div className="flex justify-between text-xs text-slate-500 mb-1 font-mono"><span>Заготовка #{index + 1}</span><span>Ост: {bar.remaining} мм</span></div>
                                <div className="h-12 w-full bg-slate-100 rounded border border-slate-300 relative flex overflow-hidden">
                                    {bar.parts.map((part, pIndex) => (
                                    <React.Fragment key={pIndex}>
                                        <div className={`h-full ${part.color} border-r border-white/20 flex items-center justify-center relative group cursor-default transition-all hover:brightness-110`} style={{ width: `${(part.length / stockLength) * 100}%` }}>
                                        <span className="text-white text-xs font-bold drop-shadow-md truncate px-1">{part.length}</span>
                                        <div className="absolute bottom-full mb-2 hidden group-hover:block bg-slate-800 text-white text-xs p-2 rounded z-10 whitespace-nowrap shadow-xl">{part.name}</div>
                                        </div>
                                        {pIndex < bar.parts.length - 1 && bladeWidth > 0 && (<div className="h-full bg-slate-400" style={{ width: `${(bladeWidth / stockLength) * 100}%` }} />)}
                                    </React.Fragment>
                                    ))}
                                    <div className="h-full bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] bg-slate-200/50 flex-1" />
                                </div>
                                </div>
                            ))}
                            {mode === 'sheet' && sheetResults && sheetResults.map((sheet, index) => (
                                <div key={sheet.id} className="border-b border-slate-100 pb-8 last:border-0 last:pb-0 print-break-inside-avoid">
                                    <div className="flex justify-between items-center mb-2"><span className="font-bold text-slate-700">Лист #{index + 1} <span className="text-xs font-normal text-slate-400 font-mono ml-2">({stockSize.w} x {stockSize.h})</span></span></div>
                                    <div className="w-full bg-slate-100 border-2 border-slate-800 relative shadow-inner overflow-hidden" style={{ aspectRatio: `${stockSize.w} / ${stockSize.h}`, backgroundImage: "url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')", backgroundBlendMode: "multiply" }}>
                                        {sheet.parts.map((part, pIndex) => (
                                            <div key={pIndex} className={`absolute ${part.color} border border-slate-900/20 hover:border-white hover:z-10 group flex flex-col items-center justify-center text-white text-[10px] md:text-xs font-bold transition-all`} style={{ left: `${(part.x / stockSize.w) * 100}%`, top: `${(part.y / stockSize.h) * 100}%`, width: `${(part.currentW / stockSize.w) * 100}%`, height: `${(part.currentH / stockSize.h) * 100}%` }}>
                                                <span className="drop-shadow-md pointer-events-none truncate max-w-full px-1">{part.name}</span>
                                                <span className="opacity-0 group-hover:opacity-100 absolute bg-black/70 px-1 rounded -bottom-6 pointer-events-none whitespace-nowrap z-20 scale-75 md:scale-100">{part.currentW} x {part.currentH} {part.rotated && '(повёрнута)'}</span>
                                                {part.rotated && <RotateCcw size={12} className="absolute top-1 right-1 opacity-50" />}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                            </div>
                        </div>
                        </div>
                    ) : (
                        <div className="h-full flex flex-col items-center justify-center text-slate-400 p-8 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50 min-h-[400px]">
                        <div className="bg-slate-100 p-6 rounded-full mb-4">{mode === 'linear' ? <Scissors size={48} className="text-slate-300" /> : <Layers size={48} className="text-slate-300" />}</div>
                        <h3 className="text-lg font-semibold text-slate-600 mb-2">Ожидание данных</h3>
                        <p className="text-center max-w-sm">Добавьте детали слева и нажмите "Рассчитать", чтобы построить карту {mode === 'linear' ? 'линейного раскроя' : 'раскроя листов'}.</p>
                        </div>
                    )}

                    <div className="lg:col-span-2">
                        <SeoDescription />
                    </div>

                    </div>
                    
                    <div className="lg:col-span-3">
                        <LegalFooter />
                    </div>

                </main>
                </div>
            );
        };

        const StatCard = ({ label, value, unit, color = 'text-slate-900' }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200">
                <div className="text-xs text-slate-400 uppercase font-bold mb-1">{label}</div>
                <div className={'text-xl md:text-2xl font-bold font-mono ' + color}>{value} <span className="text-xs md:text-sm text-slate-400 font-normal ml-0.5">{unit}</span></div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CuttingOptimizer />);
    </script>

    </body>
</html>
