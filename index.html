    <script id="worker-code" type="javascript/worker">
        self.onmessage = function(e) {
            const { mode, parts, stockLength, stockSize, bladeWidth, allowRotation } = e.data;
            
            if (mode === 'linear') {
                const result = calculateLinear(parts, stockLength, bladeWidth);
                self.postMessage(result);
            } else {
                const result = calculateSheet(parts, stockSize, bladeWidth, allowRotation);
                self.postMessage(result);
            }
        };

        // --- 1D ALGORITHM (Best Fit Descending + Local Optimization) ---
        function calculateLinear(parts, stockLength, bladeWidth) {
            // Разворачиваем детали в плоский список
            let allPieces = [];
            parts.forEach(p => { 
                for(let i=0; i < p.quantity; i++) allPieces.push({ ...p, id: p.id, uid: Math.random() }); 
            });
            // Сортируем от длинных к коротким (важно для жадных алгоритмов)
            allPieces.sort((a, b) => b.length - a.length);

            if (allPieces.some(p => p.length > stockLength)) {
                return { error: "Есть детали длиннее заготовки!" };
            }

            let bars = [];
            
            // Простой, но эффективный Best Fit Descending
            // Для каждой детали ищем заготовку, где останется МЕНЬШЕ всего места (Best Fit)
            while(allPieces.length > 0) {
                let piece = allPieces.shift();
                let bestBarIndex = -1;
                let minWaste = Infinity;

                // 1. Пробуем найти лучшую заготовку из уже начатых
                for (let i = 0; i < bars.length; i++) {
                    // Учитываем пропил ТОЛЬКО если в баре уже есть детали
                    let requiredSpace = piece.length + (bars[i].parts.length > 0 ? bladeWidth : 0);
                    
                    if (bars[i].remaining >= requiredSpace) {
                        let wasteAfter = bars[i].remaining - requiredSpace;
                        if (wasteAfter < minWaste) {
                            minWaste = wasteAfter;
                            bestBarIndex = i;
                        }
                    }
                }

                if (bestBarIndex !== -1) {
                    // Нашли место в старой
                    let bar = bars[bestBarIndex];
                    let cut = (bar.parts.length > 0 ? bladeWidth : 0);
                    bar.parts.push(piece);
                    bar.remaining -= (piece.length + cut);
                } else {
                    // Создаем новую
                    bars.push({
                        id: bars.length + 1,
                        parts: [piece],
                        remaining: stockLength - piece.length
                    });
                }
            }

            return bars;
        }

        // --- 2D ALGORITHM (Guillotine Packer - Best Short Side Fit) ---
        // Гильотинный алгоритм лучше подходит для реального раскроя (от края до края)
        function calculateSheet(parts, stockSize, bladeWidth, allowRotation) {
            let allRects = [];
            parts.forEach(p => { 
                for(let i=0; i < p.quantity; i++) {
                    allRects.push({ 
                        w: p.width, 
                        h: p.height, 
                        data: p,
                        uid: Math.random() 
                    }); 
                }
            });

            // Сортировка по площади (убывание) или по длинной стороне
            // Эвристика: Сначала самые широкие, или самые длинные, или самые большие по площади.
            // MAXSS (Maximum Short Side) часто дает лучший результат для гильотины
            allRects.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h) || (b.w * b.h) - (a.w * a.h));

            if (allRects.some(p => Math.min(p.w, p.h) > Math.min(stockSize.w, stockSize.h) && Math.max(p.w, p.h) > Math.max(stockSize.w, stockSize.h))) {
                 return { error: "Деталь больше листа!" };
            }

            let sheets = [];
            let remainingRects = [...allRects];

            while(remainingRects.length > 0) {
                let sheet = { 
                    id: sheets.length + 1, 
                    w: stockSize.w, 
                    h: stockSize.h, 
                    parts: [],
                    // Список свободных прямоугольников для гильотины
                    freeRects: [{ x: 0, y: 0, w: stockSize.w, h: stockSize.h }]
                };

                let packedIndices = [];

                // Пытаемся упаковать детали на этот лист
                for(let i = 0; i < remainingRects.length; i++) {
                    let rect = remainingRects[i];
                    
                    // Поиск лучшего места (Best Area Fit или Best Short Side Fit)
                    let bestNode = findPosition(sheet.freeRects, rect.w, rect.h, bladeWidth, allowRotation);
                    
                    if (bestNode) {
                        // Размещаем
                        let placedPart = {
                            ...rect.data,
                            x: bestNode.x,
                            y: bestNode.y,
                            currentW: bestNode.w, // Реальные размеры (мог повернуться)
                            currentH: bestNode.h,
                            rotated: bestNode.rotated
                        };
                        sheet.parts.push(placedPart);
                        
                        // Разделяем свободное пространство (Guillotine Split)
                        splitFreeRects(sheet.freeRects, bestNode, bladeWidth);
                        
                        packedIndices.push(i);
                    }
                }

                // Удаляем упакованные
                // Идем с конца, чтобы не сбить индексы, или фильтруем
                let nextQueue = [];
                for(let i=0; i<remainingRects.length; i++) {
                    if(!packedIndices.includes(i)) nextQueue.push(remainingRects[i]);
                }
                remainingRects = nextQueue;

                if (sheet.parts.length > 0) {
                    sheets.push(sheet);
                } else {
                    // Если не смогли упаковать ни одной из оставшихся деталей на новый лист - ошибка (слишком большие?)
                    // Но мы уже проверили размеры. Это safety break.
                    break;
                }
            }
            
            return sheets;
        }

        function findPosition(freeRects, w, h, bladeWidth, allowRotation) {
            let bestScore = Infinity;
            let bestRect = null;

            for (let i = 0; i < freeRects.length; i++) {
                const free = freeRects[i];

                // 1. Пробуем как есть
                if (w <= free.w && h <= free.h) {
                    // Эвристика BSSF (Best Short Side Fit): минимизируем остаток по короткой стороне
                    let leftoverW = free.w - w;
                    let leftoverH = free.h - h;
                    let score = Math.min(leftoverW, leftoverH); // Чем меньше остаток, тем лучше
                    
                    if (score < bestScore) {
                        bestScore = score;
                        bestRect = { x: free.x, y: free.y, w: w, h: h, rotated: false, freeIndex: i };
                    }
                }

                // 2. Пробуем повернуть
                if (allowRotation && h <= free.w && w <= free.h) {
                    let leftoverW = free.w - h;
                    let leftoverH = free.h - w;
                    let score = Math.min(leftoverW, leftoverH);

                    if (score < bestScore) {
                        bestScore = score;
                        bestRect = { x: free.x, y: free.y, w: h, h: w, rotated: true, freeIndex: i };
                    }
                }
            }
            return bestRect;
        }

        // Гильотинное расщепление: когда мы ставим деталь, мы режем свободный прямоугольник на два
        // L-образно. Либо сначала горизонтально, потом вертикально, либо наоборот.
        // Выбираем тот разрез, который оставляет бОльший свободный прямоугольник (MAX AREA).
        function splitFreeRects(freeRects, placedRect, bladeWidth) {
            // Находим исходный свободный прямоугольник по координатам (грубо, или через index)
            // В нашем случае findPosition вернул freeIndex, но массив мог измениться? 
            // Нет, внутри одного цикла обработки детали массив freeRects не меняем до конца шага.
            // Но лучше перебрать и найти пересекающиеся.
            
            // В гильотинном подходе, мы удаляем использованный прямоугольник и добавляем два новых.
            // Так как массив freeRects непересекающийся (обычно), найдем тот, внутри которого placedRect.
            
            // Упрощенная логика MaxRects/Guillotine для JS:
            // Просто удаляем rect index и добавляем новые куски.
            
            let parentIndex = -1;
            // Ищем прямоугольник, точно совпадающий по x,y с placedRect (он был там началом)
            for(let i=0; i<freeRects.length; i++) {
                if (freeRects[i].x === placedRect.x && freeRects[i].y === placedRect.y) {
                    parentIndex = i;
                    break;
                }
            }
            
            if (parentIndex === -1) return; // Should not happen

            let parent = freeRects[parentIndex];
            freeRects.splice(parentIndex, 1);

            // Размеры с учетом пропила для вычисления ОСТАТКОВ
            // Если мы положили деталь шириной W, то реальное занятое место W + bladeWidth (справа)
            const usedW = placedRect.w + bladeWidth;
            const usedH = placedRect.h + bladeWidth;

            // Формируем новые свободные зоны.
            // Гильотинная эвристика: Режем по МИНИМАЛЬНОЙ стороне (Shorter Axis Split) или MAX AREA
            // Обычно "Split by Shorter Axis" минимизирует узкие полоски.
            
            let freeRight, freeBottom;
            
            // Вариант 1: Вертикальный рез (справа от детали)
            // Оставшийся кусок справа: x + usedW, y, parent.w - usedW, parent.h
            // Оставшийся кусок снизу: x, y + usedH, placedRect.w, parent.h - usedH
            
            const wRem = parent.w - placedRect.w; // Без пропила в остатке, пропил "съедается"
            const hRem = parent.h - placedRect.h;
            
            // Корректировка: Свободное место начинается ПОСЛЕ пропила.
            // Если остаток меньше 0, значит места нет.
            
            const rightX = parent.x + placedRect.w + bladeWidth;
            const bottomY = parent.y + placedRect.h + bladeWidth;
            
            const rightW = parent.w - placedRect.w - bladeWidth;
            const bottomH = parent.h - placedRect.h - bladeWidth;
            
            // Определяем стратегию разреза
            // Split Horizontally (разрез продолжается вправо) -> Bottom rect full width
            // Split Vertically (разрез продолжается вниз) -> Right rect full height
            
            // Выберем стратегию "Maximise Area" для большего куска
            let splitHorizontal = (rightW * (parent.h)) > ((parent.w) * bottomH);
            
            // В гильотине принято:
            // 1. Free Rect Right: (placed.x + w + kerf), placed.y, (parent.w - w - kerf), placed.h 
            // 2. Free Rect Bottom: parent.x, (placed.y + h + kerf), parent.w, (parent.h - h - kerf)
            // Это "Full width bottom split"
            
            if (rightW > 0) {
                 freeRects.push({
                     x: rightX,
                     y: parent.y,
                     w: rightW,
                     h: parent.h // Full Height split? Нет, зависит от стратегии.
                 });
                 // Если мы добавили правый кусок на полную высоту, то нижний кусок должен быть ограничен шириной детали
                 // Но тогда это не "гильотина" в чистом виде для следующего реза.
                 // Давайте сделаем классическую эвристику "Shorter Axis Rule".
            }
            
            // Перепишем чисто:
            // Если (placed.w < placed.h) -> Вертикальный рез (справа полный, снизу только под деталью)
            // Иначе -> Горизонтальный рез (снизу полный, справа только сбоку детали)
            // Это минимизирует длину реза.
            
            const verticalSplit = placedRect.w < placedRect.h;
            
            if (verticalSplit) {
                 // Режем вертикально вдоль правой кромки детали
                 // Right: (parent.x + w + kerf), parent.y, (parent.w - w - kerf), parent.h
                 if (rightW > 0) freeRects.push({ x: rightX, y: parent.y, w: rightW, h: parent.h });
                 // Bottom: parent.x, (parent.y + h + kerf), w, (parent.h - h - kerf)
                 if (bottomH > 0) freeRects.push({ x: parent.x, y: bottomY, w: placedRect.w, h: bottomH });
            } else {
                 // Режем горизонтально вдоль нижней кромки
                 // Bottom: parent.x, (parent.y + h + kerf), parent.w, (parent.h - h - kerf)
                 if (bottomH > 0) freeRects.push({ x: parent.x, y: bottomY, w: parent.w, h: bottomH });
                 // Right: (parent.x + w + kerf), parent.y, (parent.w - w - kerf), h
                 if (rightW > 0) freeRects.push({ x: rightX, y: parent.y, w: rightW, h: placedRect.h });
            }
        }
    </script>

                    <div className="text-center md:text-left">
                        <p className="font-bold text-slate-500">&copy; 2026 Кас Мастеръ</p>
                        <p>Алгоритмы работают локально в вашем браузере.</p>
                    </div>
                    <div className="flex gap-6">
                        <a href="#" onClick={(e)=>{e.preventDefault(); alert("Все расчеты производятся локально.");}} className="hover:text-primary transition-colors underline">Конфиденциальность</a>
                    </div>
                </div>
                {/* --- Скрытый DIV для Попандера --- */}
                <div className="emhmqf417206"></div>
            </footer>
        );

        const StatCard = ({ label, value, unit, color = 'text-slate-900' }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-soft border border-slate-200 transition-all hover:shadow-md">
                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">{label}</div>
                <div className={`text-xl md:text-2xl font-bold font-mono ${color}`}>
                    {value} <span className="text-xs md:text-sm text-slate-400 font-normal ml-0.5">{unit}</span>
                </div>
            </div>
        );

        // --- ГЛАВНЫЙ КОМПОНЕНТ ---
        const App = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            const [linearParts, setLinearParts] = useState([]);
            const [sheetParts, setSheetParts] = useState([]);
            
            const parts = mode === 'linear' ? linearParts : sheetParts;
            const currentSetParts = (val) => mode === 'linear' ? setLinearParts(val) : setSheetParts(val);

            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [isCalculating, setIsCalculating] = useState(false);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');
            const workerRef = useRef(null);

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            // Инициализация Web Worker
            useEffect(() => {
                const workerCode = document.getElementById('worker-code').textContent;
                const blob = new Blob([workerCode], { type: "text/javascript" });
                workerRef.current = new Worker(URL.createObjectURL(blob));

                workerRef.current.onmessage = (e) => {
                    setIsCalculating(false);
                    const data = e.data;
                    if (data.error) {
                        alert(data.error);
                        return;
                    }
                    if (Array.isArray(data)) {
                        if (data.length > 0 && data[0].hasOwnProperty('remaining')) {
                             setResults(data);
                             setOptimizationLog(`Линейный расчет завершен. Задействовано хлыстов: ${data.length}`);
                        } else {
                             setSheetResults(data);
                             setOptimizationLog(`Листовой расчет завершен. Листов: ${data.length}`);
                        }
                    }
                };

                return () => workerRef.current.terminate();
            }, []);

            const handleNumberInput = (setter, value) => {
                setter(value === '' ? '' : Number(value));
            };

            const addPart = () => {
                const newId = Date.now() + Math.random(); 
                const newPart = { id: newId, name: `Деталь ${parts.length + 1}`, length: 1000, width: 400, height: 300, quantity: 1, color: colors[parts.length % colors.length] };
                currentSetParts([...parts, newPart]);
            };

            const clearAllParts = () => {
                if (parts.length === 0) return;
                if (window.confirm("Удалить все детали из текущего списка?")) {
                    currentSetParts([]);
                    if (mode === 'linear') setResults(null);
                    else setSheetResults(null);
                }
            };

            const removePart = (id) => currentSetParts(parts.filter(p => p.id !== id));
            const updatePart = (id, field, value) => currentSetParts(parts.map(p => p.id === id ? { ...p, [field]: value } : p));

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                const baseId = Date.now();
                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));
                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });
                if (newParts.length > 0) {
                    currentSetParts([...parts, ...newParts]);
                    setImportText('');
                    setShowImport(false);
                }
            };

            const handleCalculate = () => {
                if (parts.length === 0) return;
                setIsCalculating(true);
                setResults(null);
                setSheetResults(null);
                setOptimizationLog("Выполняется оптимизация...");

                // Отправляем данные в Worker
                workerRef.current.postMessage({
                    mode,
                    parts: JSON.parse(JSON.stringify(parts)),
                    stockLength,
                    stockSize,
                    bladeWidth,
                    allowRotation
                });
            };

            const stats = useMemo(() => {
                if (mode === 'linear' && results) {
                    const totalStock = results.length * stockLength;
                    // Реально использованный материал (сумма длин деталей)
                    const usedMaterial = results.reduce((acc, b) => acc + b.parts.reduce((pa, p) => pa + p.length, 0), 0);
                    // Общий отход (все, что не детали, включая пропилы)
                    const totalWaste = totalStock - usedMaterial;
                    const efficiency = ((usedMaterial / totalStock) * 100).toFixed(1);
                    
                    return { 
                        totalItems: results.length, 
                        efficiency, 
                        waste: totalWaste.toFixed(0), 
                        unit: 'мм', 
                        areaUnit: 'м', 
                        totalCost: (totalStock / 1000 * materialPrice).toFixed(0), 
                        wasteCost: (totalWaste / 1000 * materialPrice).toFixed(0), 
                        hasPrice: materialPrice > 0 
                    };
                } else if (mode === 'sheet' && sheetResults) {
                    const totalAreaMM = sheetResults.length * stockSize.w * stockSize.h;
                    const usedAreaMM = sheetResults.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.currentW * p.currentH), 0), 0); // Исп. оригинальные размеры p.width/height для чистого веса? Нет, используем cut size
                    const cleanUsedArea = sheetResults.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    
                    const efficiency = ((cleanUsedArea / totalAreaMM) * 100).toFixed(1);
                    const wasteMM = totalAreaMM - cleanUsedArea;
                    
                    return { 
                        totalItems: sheetResults.length, 
                        efficiency, 
                        waste: (wasteMM / 1000000).toFixed(3), 
                        unit: 'мм²', 
                        areaUnit: 'м²', 
                        totalCost: (totalAreaMM / 1000000 * materialPrice).toFixed(0), 
                        wasteCost: (wasteMM / 1000000 * materialPrice).toFixed(0), 
                        hasPrice: materialPrice > 0 
                    };
                }
                return null;
            }, [results, sheetResults, mode, stockLength, stockSize, materialPrice]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Header */}
                    <header className="bg-white shadow-soft sticky top-0 z-20 print:hidden border-b border-slate-100">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">Кас Мастеръ <span className="text-primary text-sm font-normal">PRO</span></h1>
                                <p className="text-xs text-slate-500 font-medium tracking-wide">Универсальный калькулятор раскроя</p>
                            </div>
                            <div className="bg-slate-100 p-1 rounded-lg flex shadow-inner">
                                <button onClick={() => { setMode('linear'); setOptimizationLog(''); setResults(null); }} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'linear' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Scissors size={16} /> Линейный
                                </button>
                                <button onClick={() => { setMode('sheet'); setOptimizationLog(''); setSheetResults(null); }} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'sheet' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Layers size={16} /> Листовой
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow items-start">
                        {/* Левая панель */}
                        <div className="lg:col-span-1 space-y-6 no-print">
                            <div className="card-custom overflow-hidden bg-white rounded-xl shadow-soft border border-slate-200">
                                <div className="p-4 bg-slate-50 border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide">
                                    <Settings size={16} className="text-primary" /> Параметры заготовки
                                </div>
                                <div className="p-5 space-y-5">
                                    {mode === 'linear' ? (
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Длина хлыста (мм)</label>
                                            <input type="number" value={stockLength} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setStockLength, e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Ширина</label>
                                                <input type="number" value={stockSize.w} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput((v) => setStockSize(s => ({...s, w: v})), e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Высота</label>
                                                <input type="number" value={stockSize.h} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput((v) => setStockSize(s => ({...s, h: v})), e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                            </div>
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-3 pt-2">
                                        <div><label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Пропил (мм)</label><input type="number" value={bladeWidth} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setBladeWidth, e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono outline-none"/></div>
                                        <div><label className="text-xs font-bold text-emerald-600 uppercase mb-1 block">Цена за ед.</label><input type="number" value={materialPrice} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setMaterialPrice, e.target.value)} className="w-full bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2 text-sm font-mono outline-none" placeholder="0"/></div>
                                    </div>
                                </div>
                            </div>

                            <div className="card-custom flex flex-col min-h-[500px] overflow-hidden bg-white rounded-xl shadow-soft border border-slate-200">
                                <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide"><Grid size={16} className="text-primary" /> Детали</h2>
                                    <button onClick={clearAllParts} disabled={parts.length === 0} className="clear-btn p-2 rounded-md border border-slate-200 bg-white text-slate-400 hover:text-danger hover:border-danger disabled:opacity-30 transition-all-custom font-bold text-[10px] flex items-center gap-1 uppercase tracking-tighter shadow-sm"><Trash2 size={12}/> Очистить</button>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto p-4 space-y-4">
                                    <div className="flex gap-2">
                                        {mode === 'sheet' && (
                                            <button onClick={() => setAllowRotation(!allowRotation)} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg border text-[10px] font-bold transition-all-custom shadow-sm ${allowRotation ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}`}><RotateCcw size={14} /> Вращение {allowRotation ? 'ВКЛ' : 'ВЫКЛ'}</button>
                                        )}
                                        <button onClick={() => setShowImport(!showImport)} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg border text-[10px] font-bold transition-all-custom shadow-sm ${showImport ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-primary/30'}`}><FileText size={14} /> Импорт</button>
                                    </div>
                                    
                                    {showImport ? (
                                        <div className="h-64 flex flex-col animate-in fade-in duration-300">
                                            <textarea className="w-full flex-grow p-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-primary/20 outline-none mb-3 shadow-inner" placeholder={mode === 'linear' ? "Длина Количество (например: 1500 5)" : "Ширина Высота (например: 500 400)"} value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                                            <button onClick={handleImport} className="w-full py-2.5 bg-slate-800 text-white rounded-lg font-bold text-sm shadow-md transition-all-custom active:scale-95">Добавить из текста</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 pb-4">
                                            {parts.length === 0 && (
                                                <div className="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50">
                                                     <h3 className="text-sm font-bold text-slate-700 mb-2">👋 С чего начать?</h3>
                                                     <ul className="text-xs text-slate-500 space-y-2 text-left inline-block">
                                                         <li>1. Укажите размеры <b>Заготовки</b>.</li>
                                                         <li>2. Нажмите <b>Добавить</b> или <b>Импорт</b>.</li>
                                                         <li>3. Нажмите кнопку <b>Рассчитать</b> внизу.</li>
                                                     </ul>
                                                </div>
                                            )}
                                            {parts.map((part) => (
                                                <div key={part.id} className="group relative bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all-custom">
                                                    <div className="flex justify-between items-start mb-2"><input type="text" value={part.name} onChange={(e) => updatePart(part.id, 'name', e.target.value)} className="font-bold text-slate-700 w-full focus:outline-none text-sm bg-transparent" placeholder="Название"/><button onClick={() => removePart(part.id)} className="text-slate-300 hover:text-danger ml-2 transition-colors"><Trash2 size={14} /></button></div>
                                                    <div className="flex gap-2 items-end">
                                                        {mode === 'linear' ? (
                                                            <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Длина</label><input type="number" value={part.length} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'length', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                        ) : (
                                                            <React.Fragment>
                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Шир.</label><input type="number" value={part.width} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'width', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Выс.</label><input type="number" value={part.height} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'height', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                            </React.Fragment>
                                                        )}
                                                        <div className="w-16"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Кол-во</label><input type="number" value={part.quantity} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'quantity', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono text-center font-bold"/></div>
                                                    </div>
                                                    <div className={`absolute left-0 top-0 bottom-0 w-1.5 rounded-l-xl ${part.color}`}></div>
                                                </div>
                                            ))}
                                            <button onClick={addPart} className="add-btn w-full py-3 border-2 border-dashed border-slate-300 text-slate-500 rounded-xl hover:border-primary hover:text-primary hover:bg-primary/5 transition-all-custom text-sm font-bold flex justify-center items-center gap-1 shadow-sm"><Plus size={16} /> Добавить деталь</button>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="p-4 bg-white border-t border-slate-100 shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)] shrink-0">
                                    <button onClick={handleCalculate} disabled={parts.length === 0 || isCalculating} className="w-full py-4 bg-primary hover:bg-primaryHover disabled:bg-slate-300 text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/30 flex justify-center items-center gap-2 transition-all-custom active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
                                        {isCalculating ? <div className="loader"></div> : <CalculatorIcon size={22} />} 
                                        {isCalculating ? 'Оптимизация...' : 'Рассчитать раскрой'}
                                    </button>
                                </div>
                            </div>
                            
                            <div className="card-custom p-4 text-center bg-white rounded-xl shadow-soft border border-slate-200">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Поддержать проект</p>
                                <div className="flex justify-center">
                                    <img src="f72a202f-7469-4ccd-ae92-c126326506ca.jpg" alt="QR Code" className="w-28 h-28 object-contain rounded-lg shadow-sm border border-slate-100"/>
                                </div>
                            </div>
                        </div>

                        {/* Правая панель (Результаты) */}
                        <div className="lg:col-span-2 space-y-6 print-container">
                            
                            {stats ? (
                                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 no-print">
                                        <StatCard label="Заготовок/Листов" value={stats.totalItems} unit="шт" />
                                        <StatCard label="КПД" value={stats.efficiency} unit="%" color="text-primary" />
                                        {stats.hasPrice && (
                                            <React.Fragment>
                                                <StatCard label="Сумма" value={stats.totalCost} unit="₽" color="text-emerald-600" />
                                                <StatCard label="Потери (Стоимость)" value={stats.wasteCost} unit="₽" color="text-rose-500" />
                                            </React.Fragment>
                                        )}
                                    </div>
                                    
                                    <div className="card-custom overflow-hidden bg-white rounded-xl shadow-soft border border-slate-200">
                                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 font-bold text-slate-700 text-[10px] uppercase tracking-widest no-print">
                                            Карта раскроя
                                            <button onClick={() => window.print()} className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm text-primary flex items-center gap-2 transition-all-custom hover:bg-slate-50 active:scale-95">
                                                <Download size={14} /> Печать / PDF
                                            </button>
                                        </div>
                                        <div className="p-6 space-y-8 bg-slate-50/50 min-h-[400px]">
                                            {optimizationLog && <div className="text-[10px] font-mono text-slate-400 border-b border-slate-200 pb-2 mb-4 uppercase tracking-tighter no-print">{optimizationLog}</div>}
                                            
                                            {mode === 'linear' && results && results.map((bar, index) => (
                                                <div key={index} className="print-break-inside-avoid">
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span>Заготовка #{index + 1}</span><span>Остаток: {bar.remaining} мм</span></div>
                                                    <div className="h-16 w-full bg-white rounded-lg border border-slate-300 relative flex overflow-hidden shadow-sm">
                                                        {bar.parts.map((p, pi) => (
                                                            <React.Fragment key={pi}>
                                                                <div className={`h-full ${p.color} border-r border-white/20 flex flex-col items-center justify-center text-white text-[10px] font-bold transition-all hover:brightness-110 relative group`} style={{ width: `${(p.length / stockLength) * 100}%` }}>
                                                                    <span className="z-10">{p.length}</span>
                                                                    <span className="text-[8px] opacity-70 truncate max-w-full px-1 z-10">{p.name}</span>
                                                                </div>
                                                                {pi < bar.parts.length && bladeWidth > 0 && (<div className="h-full bg-slate-800 flex items-center justify-center" style={{ width: `${(bladeWidth / stockLength) * 100}%` }} title={`Пропил ${bladeWidth}мм`}></div>)}
                                                            </React.Fragment>
                                                        ))}
                                                        <div className="h-full bg-stripes flex-1 opacity-50" title="Отход" />
                                                    </div>
                                                </div>
                                            ))}
                                            
                                            {mode === 'sheet' && sheetResults && sheetResults.map((sheet, index) => (
                                                <div key={index} className="print-break-inside-avoid mb-8 last:mb-0 page-break">
                                                    <div className="flex justify-between items-center mb-2 px-1 font-bold text-slate-700 text-sm">Лист #{index + 1}<span className="text-[10px] font-mono text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200 uppercase tracking-tighter">{stockSize.w} x {stockSize.h}</span></div>
                                                    <div className="w-full bg-white border-2 border-slate-800 relative shadow-md overflow-hidden" style={{ aspectRatio: `${stockSize.w} / ${stockSize.h}` }}>
                                                        <div className="absolute inset-0 bg-stripes opacity-10"></div>
                                                        {sheet.parts.map((p, pi) => (
                                                            <div key={pi} className={`absolute ${p.color} border border-slate-900/10 hover:border-white hover:z-10 group flex flex-col items-center justify-center text-white text-[8px] md:text-[10px] font-bold transition-all shadow-sm`} style={{ left: `${(p.x / stockSize.w) * 100}%`, top: `${(p.y / stockSize.h) * 100}%`, width: `${(p.currentW / stockSize.w) * 100}%`, height: `${(p.currentH / stockSize.h) * 100}%` }}>
                                                                <span className="drop-shadow-md pointer-events-none truncate max-w-full px-0.5">{p.name}</span>
                                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity">
                                                                     <span className="text-white text-xs">{p.currentW} x {p.currentH}</span>
                                                                </div>
                                                                {p.rotated && <div className="absolute top-0.5 right-0.5 bg-black/30 rounded-full p-0.5"><RotateCcw size={8} /></div>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="mt-2 text-[10px] text-slate-400 flex gap-4">
                                                        <span>Деталей: {sheet.parts.length}</span>
                                                        <span>Заполнение: {((sheet.parts.reduce((a,b)=>a+(b.currentW*b.currentH),0) / (stockSize.w * stockSize.h)) * 100).toFixed(1)}%</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-12 border-2 border-dashed border-slate-200 rounded-3xl bg-white min-h-[500px] shadow-soft no-print">
                                    <div className="bg-slate-100 p-6 rounded-full mb-6 shadow-sm border border-slate-100">
                                        {mode === 'linear' ? <Scissors size={48} className="text-slate-300" /> : <Layers size={48} className="text-slate-300" />}
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-600 mb-2 tracking-tight uppercase tracking-widest text-[12px]">Готов к расчету</h3>
                                    <p className="text-center max-w-xs text-sm text-slate-500 leading-relaxed">Заполните параметры материала слева и нажмите кнопку «Рассчитать раскрой»</p>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    <section className="max-w-6xl mx-auto px-4 pb-8 w-full print:hidden">
                        {/* ЗОНА ДЛЯ ВСЕЙ РЕКЛАМЫ (СНИЗУ) */}

                        <AdUnit adClass="ThaBdH418560" />
                        
                        <SeoDescription />
                    </section>
                    
                    <LegalFooter />
                </div>
            );
        };
