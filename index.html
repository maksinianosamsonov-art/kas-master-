<!-- WORKER SCRIPT (УЛУЧШЕННАЯ ЛОГИКА РАСКРОЯ) -->
<script id="worker-code" type="javascript/worker">
self.onmessage = function(e) {
    const { mode, parts, stockLength, stockSize, bladeWidth, allowRotation } = e.data;
    
    if (mode === 'linear') {
        const result = optimizeLinearUltra(parts, stockLength, bladeWidth);
        self.postMessage(result);
    } else {
        const result = optimizeSheetUltra(parts, stockSize, bladeWidth, allowRotation);
        self.postMessage(result);
    }
};

// ========================================
// 1D ОПТИМИЗАЦИЯ - УЛУЧШЕННЫЙ АЛГОРИТМ
// ========================================
function optimizeLinearUltra(parts, stockLength, bladeWidth) {
    // Собираем все детали с уникальными идентификаторами
    let allPieces = [];
    parts.forEach(p => {
        for(let i = 0; i < p.quantity; i++) {
            allPieces.push({
                ...p,
                id: p.id,
                uid: `${p.id}_${i}`,
                originalLength: p.length
            });
        }
    });
    
    // Проверка на валидность
    if (allPieces.some(p => p.length > stockLength)) {
        return { error: "Есть детали длиннее заготовки!" };
    }
    
    // Стратегия 1: First Fit Decreasing (FFD) - базовая
    let bestResult = firstFitDecreasing([...allPieces], stockLength, bladeWidth);
    let bestWaste = calculateTotalWaste(bestResult, stockLength);
    
    // Стратегия 2: Best Fit Decreasing (BFD)
    let bfdResult = bestFitDecreasing([...allPieces], stockLength, bladeWidth);
    let bfdWaste = calculateTotalWaste(bfdResult, stockLength);
    
    if (bfdWaste < bestWaste || (bfdWaste === bestWaste && bfdResult.length < bestResult.length)) {
        bestResult = bfdResult;
        bestWaste = bfdWaste;
    }
    
    // Стратегия 3: Случайные перестановки с интенсивным поиском
    const maxIterations = 3000;
    const startTime = performance.now();
    
    for (let iter = 0; iter < maxIterations; iter++) {
        // Прерываемся если прошло больше 1.5 секунд
        if (performance.now() - startTime > 1500) break;
        
        // Генерируем случайную перестановку с приоритетом больших деталей
        let shuffled = [...allPieces];
        
        if (iter % 3 === 0) {
            // Сортировка по убыванию + шум
            shuffled.sort((a, b) => (b.length + Math.random() * 50) - (a.length + Math.random() * 50));
        } else if (iter % 3 === 1) {
            // Сортировка по возрастанию
            shuffled.sort((a, b) => a.length - b.length);
        } else {
            // Полностью случайная
            shuffled.sort(() => Math.random() - 0.5);
        }
        
        // Применяем комбинированный подход
        let currentResult;
        
        if (iter % 2 === 0) {
            currentResult = firstFitDecreasing(shuffled, stockLength, bladeWidth);
        } else {
            currentResult = bestFitDecreasing(shuffled, stockLength, bladeWidth);
        }
        
        let currentWaste = calculateTotalWaste(currentResult, stockLength);
        
        // Обновляем лучший результат
        if (currentResult.length < bestResult.length || 
            (currentResult.length === bestResult.length && currentWaste < bestWaste)) {
            bestResult = currentResult;
            bestWaste = currentWaste;
        }
    }
    
    // Финальная оптимизация: попытка объединить остатки
    bestResult = optimizeRemainders(bestResult, stockLength, bladeWidth);
    
    return bestResult;
}

function firstFitDecreasing(pieces, stockLength, bladeWidth) {
    // Сортируем по убыванию
    pieces.sort((a, b) => b.length - a.length);
    
    let bars = [];
    
    for (let piece of pieces) {
        let placed = false;
        
        // Ищем первую подходящую заготовку
        for (let i = 0; i < bars.length; i++) {
            let bar = bars[i];
            let requiredSpace = piece.length + (bar.parts.length > 0 ? bladeWidth : 0);
            
            if (bar.remaining >= requiredSpace) {
                let cut = (bar.parts.length > 0 ? bladeWidth : 0);
                bar.parts.push(piece);
                bar.remaining -= (piece.length + cut);
                placed = true;
                break;
            }
        }
        
        // Если не нашли - создаём новую заготовку
        if (!placed) {
            bars.push({
                id: bars.length + 1,
                parts: [piece],
                remaining: stockLength - piece.length
            });
        }
    }
    
    return bars;
}

function bestFitDecreasing(pieces, stockLength, bladeWidth) {
    // Сортируем по убыванию
    pieces.sort((a, b) => b.length - a.length);
    
    let bars = [];
    
    for (let piece of pieces) {
        let bestBarIndex = -1;
        let minRemaining = Infinity;
        
        // Ищем заготовку, где останется минимальный остаток
        for (let i = 0; i < bars.length; i++) {
            let bar = bars[i];
            let requiredSpace = piece.length + (bar.parts.length > 0 ? bladeWidth : 0);
            
            if (bar.remaining >= requiredSpace) {
                let newRemaining = bar.remaining - requiredSpace;
                
                if (newRemaining < minRemaining) {
                    minRemaining = newRemaining;
                    bestBarIndex = i;
                }
            }
        }
        
        // Размещаем в лучшей заготовке или создаём новую
        if (bestBarIndex !== -1) {
            let bar = bars[bestBarIndex];
            let cut = (bar.parts.length > 0 ? bladeWidth : 0);
            bar.parts.push(piece);
            bar.remaining -= (piece.length + cut);
        } else {
            bars.push({
                id: bars.length + 1,
                parts: [piece],
                remaining: stockLength - piece.length
            });
        }
    }
    
    return bars;
}

function calculateTotalWaste(bars, stockLength) {
    return bars.reduce((total, bar) => total + bar.remaining, 0);
}

function optimizeRemainders(bars, stockLength, bladeWidth) {
    // Пытаемся перераспределить детали для уменьшения остатков
    let improved = true;
    
    while (improved) {
        improved = false;
        
        // Сортируем по остатку (по возрастанию)
        bars.sort((a, b) => a.remaining - b.remaining);
        
        // Ищем детали в заготовках с большим остатком
        for (let i = bars.length - 1; i > 0; i--) {
            if (bars[i].remaining < 100) continue; // Пропускаем маленькие остатки
            
            // Перебираем детали в текущей заготовке
            for (let j = 0; j < bars[i].parts.length; j++) {
                let piece = bars[i].parts[j];
                
                // Ищем место в заготовках с меньшим остатком
                for (let k = 0; k < i; k++) {
                    let targetBar = bars[k];
                    
                    // Вычисляем, сколько места нужно
                    let requiredSpace = piece.length + (targetBar.parts.length > 0 ? bladeWidth : 0);
                    
                    if (targetBar.remaining >= requiredSpace) {
                        // Перемещаем деталь
                        bars[i].parts.splice(j, 1);
                        bars[i].remaining += piece.length + (bars[i].parts.length > 0 ? bladeWidth : 0);
                        
                        let cut = (targetBar.parts.length > 0 ? bladeWidth : 0);
                        targetBar.parts.push(piece);
                        targetBar.remaining -= (piece.length + cut);
                        
                        improved = true;
                        j--; // Корректируем индекс после удаления
                        break;
                    }
                }
                
                if (improved) break;
            }
            
            if (improved) break;
        }
    }
    
    // Обновляем идентификаторы
    bars.forEach((bar, idx) => {
        bar.id = idx + 1;
    });
    
    return bars;
}

// ========================================
// 2D ОПТИМИЗАЦИЯ - УЛУЧШЕННЫЙ АЛГОРИТМ
// ========================================
function optimizeSheetUltra(parts, stockSize, bladeWidth, allowRotation) {
    let allRects = [];
    parts.forEach(p => {
        for(let i = 0; i < p.quantity; i++) {
            allRects.push({
                w: p.width,
                h: p.height,
                data: p,
                uid: `${p.id}_${i}`
            });
        }
    });
    
    // Проверка на валидность
    if (allRects.some(p => {
        if (!allowRotation) {
            return p.w > stockSize.w || p.h > stockSize.h;
        }
        return (Math.min(p.w, p.h) > Math.min(stockSize.w, stockSize.h) || 
                Math.max(p.w, p.h) > Math.max(stockSize.w, stockSize.h));
    })) {
        return { error: "Деталь больше листа!" };
    }
    
    let bestSheets = null;
    let minSheetsCount = Infinity;
    let minWasteArea = Infinity;
    
    // Стратегии сортировки
    const strategies = [
        { name: 'max_side', func: (a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h) },
        { name: 'area_desc', func: (a, b) => (b.w * b.h) - (a.w * a.h) },
        { name: 'width_desc', func: (a, b) => b.w - a.w },
        { name: 'perimeter', func: (a, b) => (b.w + b.h) - (a.w + a.h) },
        { name: 'min_side', func: (a, b) => Math.min(b.w, b.h) - Math.min(a.w, a.h) },
        { name: 'area_asc', func: (a, b) => (a.w * a.h) - (b.w * b.h) }
    ];
    
    // 1. Детерминированные стратегии
    for (let strategy of strategies) {
        let sorted = [...allRects].sort(strategy.func);
        let result = solveSheetGuillotine(sorted, stockSize, bladeWidth, allowRotation);
        let waste = calculateWasteArea(result, stockSize);
        
        if (result.length < minSheetsCount || 
            (result.length === minSheetsCount && waste < minWasteArea)) {
            bestSheets = result;
            minSheetsCount = result.length;
            minWasteArea = waste;
        }
    }
    
    // 2. Случайные перестановки с интенсивным поиском
    const maxIterations = 1000;
    const startTime = performance.now();
    
    for (let iter = 0; iter < maxIterations; iter++) {
        if (performance.now() - startTime > 2000) break;
        
        // Генерируем случайную перестановку
        let shuffled = [...allRects];
        
        if (iter % 4 === 0) {
            // Сортировка по площади + шум
            shuffled.sort((a, b) => (b.w * b.h + Math.random() * 1000) - (a.w * a.h + Math.random() * 1000));
        } else if (iter % 4 === 1) {
            // Сортировка по максимальной стороне
            shuffled.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h));
        } else if (iter % 4 === 2) {
            // Сортировка по минимальной стороне
            shuffled.sort((a, b) => Math.min(b.w, b.h) - Math.min(a.w, a.h));
        } else {
            // Полностью случайная
            shuffled.sort(() => Math.random() - 0.5);
        }
        
        let result = solveSheetGuillotine(shuffled, stockSize, bladeWidth, allowRotation);
        let waste = calculateWasteArea(result, stockSize);
        
        if (result.length < minSheetsCount || 
            (result.length === minSheetsCount && waste < minWasteArea)) {
            bestSheets = result;
            minSheetsCount = result.length;
            minWasteArea = waste;
        }
    }
    
    // 3. Финальная оптимизация: попытка перераспределения
    bestSheets = optimizeSheetDistribution(bestSheets, stockSize, bladeWidth, allowRotation);
    
    return bestSheets;
}

function solveSheetGuillotine(allRects, stockSize, bladeWidth, allowRotation) {
    let sheets = [];
    let remaining = [...allRects];
    
    while (remaining.length > 0) {
        let sheet = {
            id: sheets.length + 1,
            w: stockSize.w,
            h: stockSize.h,
            parts: [],
            freeSpaces: [{ x: 0, y: 0, w: stockSize.w, h: stockSize.h }]
        };
        
        let placedIndices = [];
        
        // Сортируем свободные пространства по площади (по убыванию)
        sheet.freeSpaces.sort((a, b) => (b.w * b.h) - (a.w * a.h));
        
        for (let i = 0; i < remaining.length; i++) {
            let rect = remaining[i];
            
            // Ищем лучшее место для размещения
            let bestSpace = findBestFitSpace(sheet.freeSpaces, rect, bladeWidth, allowRotation);
            
            if (bestSpace) {
                // Размещаем деталь
                let placedPart = {
                    ...rect.data,
                    x: bestSpace.x,
                    y: bestSpace.y,
                    currentW: bestSpace.placedW,
                    currentH: bestSpace.placedH,
                    rotated: bestSpace.rotated
                };
                
                sheet.parts.push(placedPart);
                
                // Обновляем свободные пространства
                updateFreeSpaces(sheet.freeSpaces, bestSpace, bladeWidth);
                
                placedIndices.push(i);
            }
        }
        
        // Формируем следующую очередь
        let nextQueue = [];
        for (let i = 0; i < remaining.length; i++) {
            if (!placedIndices.includes(i)) {
                nextQueue.push(remaining[i]);
            }
        }
        
        remaining = nextQueue;
        
        if (sheet.parts.length > 0) {
            sheets.push(sheet);
        } else {
            break; // Защита от бесконечного цикла
        }
    }
    
    return sheets;
}

function findBestFitSpace(freeSpaces, rect, bladeWidth, allowRotation) {
    let bestScore = Infinity;
    let bestSpace = null;
    
    for (let i = 0; i < freeSpaces.length; i++) {
        let space = freeSpaces[i];
        
        // Прямая ориентация
        if (rect.w <= space.w && rect.h <= space.h) {
            let wasteW = space.w - rect.w;
            let wasteH = space.h - rect.h;
            let score = wasteW * wasteH; // Минимизируем площадь отхода
            
            if (score < bestScore) {
                bestScore = score;
                bestSpace = {
                    x: space.x,
                    y: space.y,
                    placedW: rect.w,
                    placedH: rect.h,
                    rotated: false,
                    spaceIndex: i,
                    spaceW: space.w,
                    spaceH: space.h
                };
            }
        }
        
        // Поворот (если разрешён)
        if (allowRotation && rect.h <= space.w && rect.w <= space.h) {
            let wasteW = space.w - rect.h;
            let wasteH = space.h - rect.w;
            let score = wasteW * wasteH;
            
            if (score < bestScore) {
                bestScore = score;
                bestSpace = {
                    x: space.x,
                    y: space.y,
                    placedW: rect.h,
                    placedH: rect.w,
                    rotated: true,
                    spaceIndex: i,
                    spaceW: space.w,
                    spaceH: space.h
                };
            }
        }
    }
    
    return bestSpace;
}

function updateFreeSpaces(freeSpaces, placed, bladeWidth) {
    const index = placed.spaceIndex;
    
    if (index < 0 || index >= freeSpaces.length) return;
    
    let parent = freeSpaces[index];
    freeSpaces.splice(index, 1);
    
    const placedRight = placed.x + placed.placedW + bladeWidth;
    const placedBottom = placed.y + placed.placedH + bladeWidth;
    
    const rightW = parent.x + parent.w - placedRight;
    const bottomH = parent.y + parent.h - placedBottom;
    
    const EPSILON = 0.001;
    
    // Горизонтальный разрез: создаём пространство справа
    if (rightW > EPSILON) {
        freeSpaces.push({
            x: placedRight,
            y: placed.y,
            w: rightW,
            h: placed.placedH
        });
    }
    
    // Вертикальный разрез: создаём пространство снизу
    if (bottomH > EPSILON) {
        freeSpaces.push({
            x: parent.x,
            y: placedBottom,
            w: parent.w,
            h: bottomH
        });
    }
    
    // Сортируем по площади для приоритезации
    freeSpaces.sort((a, b) => (b.w * b.h) - (a.w * a.h));
}

function calculateWasteArea(sheets, stockSize) {
    let totalArea = sheets.length * stockSize.w * stockSize.h;
    let usedArea = 0;
    
    sheets.forEach(sheet => {
        sheet.parts.forEach(part => {
            usedArea += part.width * part.height;
        });
    });
    
    return totalArea - usedArea;
}

function optimizeSheetDistribution(sheets, stockSize, bladeWidth, allowRotation) {
    // Пытаемся перераспределить детали между листами
    if (sheets.length < 2) return sheets;
    
    let improved = true;
    
    while (improved) {
        improved = false;
        
        // Сортируем листы по заполненности (по возрастанию)
        sheets.sort((a, b) => {
            let fillA = a.parts.reduce((sum, p) => sum + p.width * p.height, 0);
            let fillB = b.parts.reduce((sum, p) => sum + p.width * p.height, 0);
            return fillA - fillB;
        });
        
        // Берём самый заполненный лист
        let sourceSheet = sheets[sheets.length - 1];
        
        if (sourceSheet.parts.length <= 1) continue;
        
        // Перебираем детали в источнике
        for (let i = 0; i < sourceSheet.parts.length; i++) {
            let piece = sourceSheet.parts[i];
            
            // Ищем место в менее заполненных листах
            for (let targetIdx = 0; targetIdx < sheets.length - 1; targetIdx++) {
                let targetSheet = sheets[targetIdx];
                
                // Создаём временный лист для проверки
                let tempSheet = {
                    w: stockSize.w,
                    h: stockSize.h,
                    parts: [...targetSheet.parts],
                    freeSpaces: [{ x: 0, y: 0, w: stockSize.w, h: stockSize.h }]
                };
                
                // Проверяем, можно ли разместить
                let canPlace = false;
                let bestSpace = null;
                
                tempSheet.freeSpaces.sort((a, b) => (b.w * b.h) - (a.w * a.h));
                
                for (let space of tempSheet.freeSpaces) {
                    if (piece.width <= space.w && piece.height <= space.h) {
                        canPlace = true;
                        bestSpace = space;
                        break;
                    }
                    
                    if (allowRotation && piece.height <= space.w && piece.width <= space.h) {
                        canPlace = true;
                        bestSpace = space;
                        break;
                    }
                }
                
                if (canPlace) {
                    // Перемещаем деталь
                    sourceSheet.parts.splice(i, 1);
                    targetSheet.parts.push(piece);
                    
                    improved = true;
                    i--; // Корректируем индекс
                    break;
                }
            }
            
            if (improved) break;
        }
        
        // Удаляем пустые листы
        sheets = sheets.filter(sheet => sheet.parts.length > 0);
        
        // Обновляем идентификаторы
        sheets.forEach((sheet, idx) => {
            sheet.id = idx + 1;
        });
    }
    
    return sheets;
}
</script>
