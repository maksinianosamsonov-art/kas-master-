<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ИКОНКИ ---
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>

        const Scissors = (p) => <IconWrapper {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></IconWrapper>;
        const Grid = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></IconWrapper>;
        const Layers = (p) => <IconWrapper {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
        const RotateCcw = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
        const Calculator = (p) => <IconWrapper {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>;
        const Download = (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;

        // --- УМНЫЙ КОМПОНЕНТ ДЛЯ РЕКЛАМЫ ---
        const AdUnit = ({ adClass }) => {
            return (
                <div className="print:hidden w-full ad-container-wrapper">
                    <div className={adClass}></div>
                </div>
            );
        };

        const SeoDescription = () => (
            <div className="seo-text mt-12 bg-white rounded-xl border border-slate-200 p-6 md:p-8 shadow-soft">
                <h3 className="text-xl font-bold text-slate-800 mb-4 text-center">Оптимизатор раскроя материалов «Кас Мастеръ»</h3>
                <div className="grid md:grid-cols-2 gap-8 text-sm text-slate-600 leading-relaxed">
                    <div className="prose">
                        <h4 className="font-bold text-slate-700 mb-2">Линейный раскрой (1D)</h4>
                        <p>Идеально подходит для погонажных материалов: трубы, арматура, брус. Помогает минимизировать остатки и сократить расходы.</p>
                    </div>
                    <div className="prose">
                        <h4 className="font-bold text-slate-700 mb-2">Листовой раскрой (2D)</h4>
                        <p>Оптимизация раскроя листовых материалов (ЛДСП, фанера, металл). Позволяет вращать детали для более плотной укладки.</p>
                    </div>
                </div>
            </div>
        );

        const LegalFooter = () => (
            <footer className="mt-12 border-t border-slate-200 pt-8 pb-12 bg-slate-50">
                <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-xs text-slate-400">
                    <div className="text-center md:text-left">
                        <p className="font-bold text-slate-500">&copy; 2026 Кас Мастеръ</p>
                        <p>Все расчеты выполняются локально в браузере.</p>
                    </div>
                    <div className="flex gap-6">
                        <a href="#" onClick={(e)=>{e.preventDefault(); alert("Все расчеты производятся локально.");}} className="hover:text-primary transition-colors underline">Конфиденциальность</a>
                    </div>
                </div>
                {/* --- Скрытый DIV для Попандера --- */}
                <div className="emhmqf417206"></div>
            </footer>
        );

        const StatCard = ({ label, value, unit, color = 'text-slate-900' }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-soft border border-slate-200 transition-all hover:shadow-md">
                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">{label}</div>
                <div className={`text-xl md:text-2xl font-bold font-mono ${color}`}>
                    {value} <span className="text-xs md:text-sm text-slate-400 font-normal ml-0.5">{unit}</span>
                </div>
            </div>
        );

        // --- КОМПОНЕНТ ИГРЫ ШАШКИ ---
        const CheckersGame = () => {
            return (
                <div className="checkers-wrapper-print print:hidden mt-16 mb-8">
                    <div className="max-w-6xl mx-auto px-4">
                        <div className="text-center mb-6">
                            <h3 className="text-xl font-bold text-slate-700">Устали от расчетов?</h3>
                            <p className="text-sm text-slate-500">Сыграйте партию в шашки с ИИ, пока отдыхаете</p>
                        </div>
                        <div className="checkers-container" id="checkers-game">
                            <div className="checkers-header">
                                <h2>♟️ Шашки ♟️</h2>
                                <div className="checkers-difficulty">
                                    <label>
                                        Сложность: 
                                        <select id="difficulty" defaultValue="medium" className="ml-2">
                                            <option value="easy">Легко</option>
                                            <option value="medium">Средне</option>
                                            <option value="hard">Сложно</option>
                                        </select>
                                    </label>
                                </div>
                            </div>
                            <div className="checkers-status" id="status">Ваш ход (белые)</div>
                            <div className="checkers-board" id="board"></div>
                            <div className="checkers-controls">
                                <button className="checkers-btn reset" id="reset">Новая игра</button>
                                <button className="checkers-btn" id="undo">Отменить ход</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ГЛАВНЫЙ КОМПОНЕНТ ---
        const App = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            const [linearParts, setLinearParts] = useState([]);
            const [sheetParts, setSheetParts] = useState([]);
            
            const parts = mode === 'linear' ? linearParts : sheetParts;
            const currentSetParts = (val) => mode === 'linear' ? setLinearParts(val) : setSheetParts(val);

            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            const handleNumberInput = (setter, value) => {
                setter(value === '' ? '' : Number(value));
            };

            const addPart = () => {
                const newId = Date.now() + Math.random(); 
                const newPart = { id: newId, name: `Деталь ${parts.length + 1}`, length: 1000, width: 400, height: 300, quantity: 1, color: colors[parts.length % colors.length] };
                currentSetParts([...parts, newPart]);
            };

            const clearAllParts = () => {
                if (parts.length === 0) return;
                if (window.confirm("Удалить все детали из текущего списка?")) {
                    currentSetParts([]);
                    if (mode === 'linear') setResults(null);
                    else setSheetResults(null);
                }
            };

            const removePart = (id) => currentSetParts(parts.filter(p => p.id !== id));
            const updatePart = (id, field, value) => currentSetParts(parts.map(p => p.id === id ? { ...p, [field]: value } : p));

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                const baseId = Date.now();
                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));
                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });
                if (newParts.length > 0) {
                    currentSetParts([...parts, ...newParts]);
                    setImportText('');
                    setShowImport(false);
                }
            };

            const handleCalculate = () => {
                if (mode === 'linear') {
                    let allPieces = [];
                    linearParts.forEach(p => { for (let i = 0; i < p.quantity; i++) allPieces.push({ ...p }); });
                    allPieces.sort((a, b) => b.length - a.length);
                    if (allPieces.some(p => p.length > stockLength)) { alert("Деталь длиннее заготовки!"); return; }
                    let bars = [];
                    allPieces.forEach(piece => {
                        let bestIdx = -1, minWaste = Infinity;
                        for (let i = 0; i < bars.length; i++) {
                            const needed = bars[i].parts.length > 0 ? piece.length + bladeWidth : piece.length;
                            if (bars[i].remaining >= needed && (bars[i].remaining - needed) < minWaste) { minWaste = bars[i].remaining - needed; bestIdx = i; }
                        }
                        if (bestIdx !== -1) {
                            const bar = bars[bestIdx];
                            const used = bar.parts.length === 0 ? piece.length : piece.length + bladeWidth;
                            bar.parts.push(piece); bar.remaining -= used;
                        } else {
                            bars.push({ id: bars.length + 1, parts: [piece], remaining: stockLength - piece.length });
                        }
                    });
                    setResults(bars); setOptimizationLog("Расчет завершен.");
                } else {
                    let rawRects = [];
                    sheetParts.forEach(p => { for (let i = 0; i < p.quantity; i++) rawRects.push({ ...p, uniqueId: `${p.id}-${i}` }); });
                    if (rawRects.some(p => Math.min(p.width, p.height) > Math.min(stockSize.w, stockSize.h) && Math.max(p.width, p.height) > Math.max(stockSize.w, stockSize.h))) { alert("Деталь больше листа!"); return; }
                    
                    const packOneSheet = (remainingRects, stock, kerf, rotate) => {
                        let freeRects = [{ x: 0, y: 0, w: stock.w, h: stock.h }];
                        let placedParts = []; let packedIndices = new Set();
                        const splitFreeRect = (free, px, py, pw, ph) => {
                            const newFree = [];
                            const rx = px + pw + kerf; const by = py + ph + kerf;
                            if (rx < free.x + free.w) newFree.push({ x: rx, y: free.y, w: free.x + free.w - rx, h: free.h });
                            if (by < free.y + free.h) newFree.push({ x: free.x, y: by, w: Math.min(pw, free.w), h: free.y + free.h - by });
                            return newFree;
                        };
                        for (let i = 0; i < remainingRects.length; i++) {
                            if (packedIndices.has(i)) continue;
                            const part = remainingRects[i];
                            let bestScore = Infinity, bestPlacement = null, bestNewFree = null;
                            for (let f = 0; f < freeRects.length; f++) {
                                const free = freeRects[f];
                                if (part.width <= free.w && part.height <= free.h) {
                                    const score = (free.w - part.width) * (free.h - part.height);
                                    if (score < bestScore) { bestScore = score; bestPlacement = { f, rotated: false, x: free.x, y: free.y, w: part.width, h: part.height }; bestNewFree = splitFreeRect(free, free.x, free.y, part.width, part.height); }
                                }
                                if (rotate && part.height <= free.w && part.width <= free.h) {
                                    const score = (free.w - part.height) * (free.h - part.width);
                                    if (score < bestScore) { bestScore = score; bestPlacement = { f, rotated: true, x: free.x, y: free.y, w: part.height, h: part.width }; bestNewFree = splitFreeRect(free, free.x, free.y, part.height, part.width); }
                                }
                            }
                            if (bestPlacement) {
                                const { f, rotated, x, y, w, h } = bestPlacement;
                                placedParts.push({ ...part, x, y, currentW: w, currentH: h, rotated });
                                packedIndices.add(i);
                                freeRects.splice(f, 1); freeRects.push(...bestNewFree);
                            }
                        }
                        return { placedParts, packedIndices };
                    };

                    let remaining = [...rawRects].sort((a,b) => (b.width * b.height) - (a.width * a.height));
                    let sheets = [];
                    while (remaining.length > 0) {
                        const { placedParts, packedIndices } = packOneSheet(remaining, stockSize, bladeWidth, allowRotation);
                        if (placedParts.length === 0) break;
                        sheets.push({ id: sheets.length + 1, parts: placedParts });
                        remaining = remaining.filter((_, i) => !packedIndices.has(i));
                    }
                    setSheetResults(sheets);
                    const totalArea = sheets.length * stockSize.w * stockSize.h;
                    const usedArea = sheets.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    setOptimizationLog(`Листовой расчет завершен. КПД: ${(usedArea / totalArea * 100).toFixed(1)}%`);
                }
            };

            const stats = useMemo(() => {
                if (mode === 'linear' && results) {
                    const totalStock = results.length * stockLength;
                    const used = results.reduce((acc, b) => acc + b.parts.reduce((pa, p) => pa + p.length, 0), 0);
                    const efficiency = ((used / totalStock) * 100).toFixed(1);

    <script>
    class Checkers {      constructor() {        this.board = Array(8).fill().map(() => Array(8).fill(null));        this.playerColor = 'white';        this.aiColor = 'black';        this.currentPlayer = this.playerColor;        this.selectedPiece = null;        this.validMoves = [];        this.history = [];        this.difficulty = 'medium';                this.initBoard();        this.renderBoard();        this.bindEvents();      }
      initBoard() {        // Чёрные шашки        for (let row = 0; row < 3; row++) {          for (let col = 0; col < 8; col++) {            if ((row + col) % 2 === 1) {              this.board[row][col] = { color: 'black', king: false };            }          }        }        // Белые шашки        for (let row = 5; row < 8; row++) {          for (let col = 0; col < 8; col++) {            if ((row + col) % 2 === 1) {              this.board[row][col] = { color: 'white', king: false };            }          }        }      }
      renderBoard() {        const boardEl = document.getElementById('board');        if(!boardEl) return;
        boardEl.innerHTML = '';                for (let row = 0; row < 8; row++) {          for (let col = 0; col < 8; col++) {            const cell = document.createElement('div');            cell.className = `checkers-cell ${(row + col) % 2 === 0 ? 'checkers-light' : 'checkers-dark'}`;            cell.dataset.row = row;            cell.dataset.col = col;                        if (this.selectedPiece && this.selectedPiece.row === row && this.selectedPiece.col === col) {              cell.classList.add('selected');            }                        const piece = this.board[row][col];            if (piece) {              const pieceEl = document.createElement('div');              pieceEl.className = `checkers-piece checkers-${piece.color} ${piece.king ? 'checkers-king' : ''}`;              cell.appendChild(pieceEl);            }                        const move = this.validMoves.find(m => m.to.row === row && m.to.col === col);            if (move) {              cell.classList.add('highlight');            }                        boardEl.appendChild(cell);          }        }                this.updateStatus();      }
      updateStatus() {        const statusEl = document.getElementById('status');        if(!statusEl) return;
        const whiteCount = this.countPieces('white');        const blackCount = this.countPieces('black');                if (whiteCount === 0) {          statusEl.textContent = '🤖 ИИ победил!';          this.currentPlayer = null;        } else if (blackCount === 0) {          statusEl.textContent = '🎉 Вы победили!';          this.currentPlayer = null;        } else if (this.currentPlayer === this.playerColor) {          statusEl.textContent = 'Ваш ход (белые)';        } else {          statusEl.textContent = 'Ход ИИ (чёрные)...';        }      }
      countPieces(color) {        return this.board.flat().filter(p => p && p.color === color).length;      }
      bindEvents() {        const board = document.getElementById('board');        if(board) {            board.addEventListener('click', (e) => {            if (this.currentPlayer !== this.playerColor) return;                    const cell = e.target.closest('.checkers-cell');            if (!cell) return;                    const row = parseInt(cell.dataset.row);            const col = parseInt(cell.dataset.col);                    const piece = this.board[row][col];                    // Выбор шашки            if (piece && piece.color === this.playerColor) {                this.selectedPiece = { row, col };                this.validMoves = this.getValidMoves(row, col);                this.renderBoard();                return;            }                    // Ход шашкой            if (this.selectedPiece) {                const move = this.validMoves.find(m => m.to.row === row && m.to.col === col);                if (move) {                this.saveHistory();                this.makeMove(move);                            // Если был захват — проверяем продолжение                if (move.capture && this.hasContinuationCaptures(move.to.row, move.to.col)) {                    this.selectedPiece = { row: move.to.row, col: move.to.col };                    this.validMoves = this.getValidMoves(move.to.row, move.to.col).filter(m => m.capture);                    this.renderBoard();                } else {                    this.endTurn();                }                } else {                this.selectedPiece = null;                this.validMoves = [];                this.renderBoard();                }            }            });        }        const resetBtn = document.getElementById('reset');        if(resetBtn) resetBtn.addEventListener('click', () => this.reset());        
        const undoBtn = document.getElementById('undo');
        if(undoBtn) undoBtn.addEventListener('click', () => this.undo());
        
        const diffSelect = document.getElementById('difficulty');
        if(diffSelect) diffSelect.addEventListener('change', (e) => {          this.difficulty = e.target.value;        });      }
      getValidMoves(row, col) {        const piece = this.board[row][col];        if (!piece) return [];                const moves = [];        const directions = piece.king ?           [[-1, -1], [-1, 1], [1, -1], [1, 1]] :           (piece.color === 'white' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]);                // Проверка захватов        for (const [dr, dc] of directions) {          let r = row + dr, c = col + dc;                    if (this.isOnBoard(r + dr, c + dc) &&               this.board[r][c] &&               this.board[r][c].color !== piece.color &&              !this.board[r + dr][c + dc]) {            moves.push({              from: { row, col },              to: { row: r + dr, col: c + dc },              capture: { row: r, col: c }            });          }        }                // Если есть захваты — только они доступны        if (moves.length > 0) return moves;                // Простые ходы        for (const [dr, dc] of directions) {          const r = row + dr, c = col + dc;          if (this.isOnBoard(r, c) && !this.board[r][c]) {            moves.push({              from: { row, col },              to: { row: r, col: c },              capture: null            });          }        }                return moves;      }
      isOnBoard(row, col) {        return row >= 0 && row < 8 && col >= 0 && col < 8;      }
      hasContinuationCaptures(row, col) {        const moves = this.getValidMoves(row, col);        return moves.some(m => m.capture);      }
      makeMove(move) {        const { from, to, capture } = move;        const piece = this.board[from.row][from.col];                // Перемещение        this.board[to.row][to.col] = { ...piece };        this.board[from.row][from.col] = null;                // Захват        if (capture) {          this.board[capture.row][capture.col] = null;        }                // Превращение в дамку        if (!piece.king) {          if (piece.color === 'white' && to.row === 0) {            this.board[to.row][to.col].king = true;          } else if (piece.color === 'black' && to.row === 7) {            this.board[to.row][to.col].king = true;          }        }      }
      endTurn() {        this.selectedPiece = null;        this.validMoves = [];                // Проверка обязательных захватов для следующего игрока        const hasForced = this.hasForcedMoves(this.currentPlayer === 'white' ? 'black' : 'white');                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';                this.renderBoard();                // Ход ИИ        if (this.currentPlayer === this.aiColor && this.currentPlayer !== null) {          setTimeout(() => this.aiMove(), 600);        }      }
      hasForcedMoves(color) {        for (let row = 0; row < 8; row++) {          for (let col = 0; col < 8; col++) {            const piece = this.board[row][col];            if (piece && piece.color === color) {              const moves = this.getValidMoves(row, col);              if (moves.some(m => m.capture)) return true;            }          }        }        return false;      }
      aiMove() {        if (this.currentPlayer !== this.aiColor) return;                // Собираем все возможные ходы        const allMoves = [];        for (let row = 0; row < 8; row++) {          for (let col = 0; col < 8; col++) {            const piece = this.board[row][col];            if (piece && piece.color === this.aiColor) {              const moves = this.getValidMoves(row, col);              moves.forEach(move => {                allMoves.push({ piece: { row, col }, ...move });              });            }          }        }                if (allMoves.length === 0) return;                // Фильтруем только захваты, если они есть        const captureMoves = allMoves.filter(m => m.capture);        let movesToChoose = captureMoves.length > 0 ? captureMoves : allMoves;                // Выбор хода в зависимости от сложности        let move;        if (this.difficulty === 'easy') {          // Случайный ход          move = movesToChoose[Math.floor(Math.random() * movesToChoose.length)];        } else if (this.difficulty === 'medium') {          // Предпочитаем захваты и продвижение вперёд          movesToChoose.sort((a, b) => {            let scoreA = 0, scoreB = 0;                        if (a.capture) scoreA += 10;            if (b.capture) scoreB += 10;                        // Предпочитаем продвижение вперёд            if (a.to.row < a.piece.row) scoreA += 2;            if (b.to.row < b.piece.row) scoreB += 2;                        return scoreB - scoreA;          });                    // Берём один из лучших ходов (не всегда самый лучший для "человечности")          const topMoves = movesToChoose.slice(0, Math.min(3, movesToChoose.length));          move = topMoves[Math.floor(Math.random() * topMoves.length)];        } else { // hard          // Более агрессивная стратегия          movesToChoose.sort((a, b) => {            let scoreA = 0, scoreB = 0;                        if (a.capture) scoreA += 15;            if (b.capture) scoreB += 15;                        // Двойные захваты            if (a.capture && this.hasContinuationCaptures(a.to.row, a.to.col)) scoreA += 20;            if (b.capture && this.hasContinuationCaptures(b.to.row, b.to.col)) scoreB += 20;                        // Защита шашек            if (this.isSafePosition(a.to.row, a.to.col)) scoreA += 5;            if (this.isSafePosition(b.to.row, b.to.col)) scoreB += 5;                        // Продвижение к дамке            if (this.board[a.piece.row][a.piece.col] && !this.board[a.piece.row][a.piece.col].king) {              scoreA += (7 - a.to.row) * 0.5;            }                        return scoreB - scoreA;          });                    move = movesToChoose[0];        }                // Выполняем ход        this.saveHistory();        this.makeMove(move);                // Проверка продолжения захвата        if (move.capture && this.hasContinuationCaptures(move.to.row, move.to.col)) {          setTimeout(() => this.aiMove(), 400);        } else {          setTimeout(() => this.endTurn(), 400);        }      }
      isSafePosition(row, col) {        const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];        for (const [dr, dc] of directions) {          const r = row + dr, c = col + dc;          if (this.isOnBoard(r, c) && this.board[r][c] && this.board[r][c].color === this.playerColor) {            const rr = r + dr, cc = c + dc;            if (this.isOnBoard(rr, cc) && !this.board[rr][cc]) {              return false; // Могут захватить            }          }        }        return true;      }
      saveHistory() {        const snapshot = JSON.parse(JSON.stringify(this.board));        this.history.push({          board: snapshot,          currentPlayer: this.currentPlayer,          selectedPiece: this.selectedPiece ? { ...this.selectedPiece } : null        });      }
      undo() {        if (this.history.length === 0 || this.currentPlayer === this.aiColor) return;                const lastState = this.history.pop();        if (lastState) {          this.board = JSON.parse(JSON.stringify(lastState.board));          this.currentPlayer = lastState.currentPlayer;          this.selectedPiece = lastState.selectedPiece ? { ...lastState.selectedPiece } : null;          this.validMoves = this.selectedPiece ?             this.getValidMoves(this.selectedPiece.row, this.selectedPiece.col) : [];          this.renderBoard();        }      }
      reset() {        this.history = [];        this.selectedPiece = null;        this.validMoves = [];        this.currentPlayer = this.playerColor;        const diffEl = document.getElementById('difficulty');
        if(diffEl) this.difficulty = diffEl.value;
        this.initBoard();        this.renderBoard();      }    }
    
    // Запуск игры после загрузки страницы
    window.addEventListener('load', () => {
        setTimeout(() => {
            if(document.getElementById('board')) {
                window.checkersGame = new Checkers();
            }
        }, 500); // Небольшая задержка, чтобы React успел отрисовать DOM
    });
    </script>
