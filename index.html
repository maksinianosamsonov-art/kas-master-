        // --- ОСНОВНОЙ КОМПОНЕНТ ---
        const CuttingOptimizer = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            // Раздельное состояние для списков деталей
            // Это решает проблему "дублирования" деталей в разных режимах
            const [linearParts, setLinearParts] = useState([]);
            const [sheetParts, setSheetParts] = useState([]);
            
            // Текущий активный список в зависимости от режима
            const parts = mode === 'linear' ? linearParts : sheetParts;
            
            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            const addPart = () => {
                const newId = Date.now(); 
                const newPart = { 
                    id: newId, 
                    name: `Деталь ${parts.length + 1}`, 
                    length: 1000, 
                    width: 400, 
                    height: 300, 
                    quantity: 1, 
                    color: colors[parts.length % colors.length] 
                };
                
                if (mode === 'linear') {
                    setLinearParts([...linearParts, newPart]);
                } else {
                    setSheetParts([...sheetParts, newPart]);
                }
            };

            // Исправленная функция очистки
            const clearAllParts = () => {
                if (parts.length === 0) return;
                
                if (window.confirm("Удалить все детали из текущего списка?")) {
                    if (mode === 'linear') {
                        setLinearParts([]);
                        setResults(null);
                    } else {
                        setSheetParts([]);
                        setSheetResults(null);
                    }
                }
            };

            const removePart = (id) => {
                if (mode === 'linear') {
                    setLinearParts(linearParts.filter(p => p.id !== id));
                } else {
                    setSheetParts(sheetParts.filter(p => p.id !== id));
                }
            };

            const updatePart = (id, field, value) => {
                if (mode === 'linear') {
                    setLinearParts(linearParts.map(p => p.id === id ? { ...p, [field]: value } : p));
                } else {
                    setSheetParts(sheetParts.map(p => p.id === id ? { ...p, [field]: value } : p));
                }
            };

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                const baseId = Date.now();

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));

                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });

                if (newParts.length > 0) {
                    if (mode === 'linear') {
                        setLinearParts([...linearParts, ...newParts]);
                    } else {
                        setSheetParts([...sheetParts, ...newParts]);
                    }
                    setImportText('');
                    setShowImport(false);
                } else {
                    alert('Не удалось распознать данные. Проверьте формат.');
                }
            };

            // Алгоритмы (остались без изменений логики, но код сжат для краткости)
            const calculateLinear = () => {
                let allPieces = [];
                linearParts.forEach(part => { for (let i = 0; i < part.quantity; i++) allPieces.push({ ...part }); });
                allPieces.sort((a, b) => b.length - a.length);
                if (allPieces.some(p => p.length > stockLength)) { alert("Ошибка: Деталь длиннее заготовки!"); return; }
                let bars = [];
                allPieces.forEach(piece => {
                    let bestBarIndex = -1, minWaste = Infinity;
                    for (let i = 0; i < bars.length; i++) {
                        const neededSpace = bars[i].parts.length > 0 ? piece.length + bladeWidth : piece.length;
                        if (bars[i].remaining >= neededSpace) {
                            const waste = bars[i].remaining - neededSpace;
                            if (waste < minWaste) { minWaste = waste; bestBarIndex = i; }
                        }
                    }
                    if (bestBarIndex !== -1) {
                        const bar = bars[bestBarIndex];
                        const isFirst = bar.parts.length === 0;
                        const used = isFirst ? piece.length : piece.length + bladeWidth;
                        bar.parts.push(piece); bar.remaining -= used; bar.usedLength += used;
                    } else {
                        bars.push({ id: bars.length + 1, parts: [piece], remaining: stockLength - piece.length, usedLength: piece.length, totalLength: stockLength });
                    }
                });
                setResults(bars); 
                // Не трогаем sheetResults
                setOptimizationLog("Использован алгоритм First Fit Decreasing (FFD).");
            };

            const calculateSheet = () => {
                let rawRects = [];
                sheetParts.forEach(part => { for (let i = 0; i < part.quantity; i++) { rawRects.push({ ...part, uniqueId: `${part.id}-${i}` }); } });
                if (rawRects.some(p => Math.min(p.width, p.height) > Math.min(stockSize.w, stockSize.h) && Math.max(p.width, p.height) > Math.max(stockSize.w, stockSize.h))) { alert("Ошибка: Деталь больше размера листа!"); return; }
                const strategies = [{ name: "По площади", sort: (a, b) => (b.width * b.height) - (a.width * a.height) }, { name: "По длинной стороне", sort: (a, b) => Math.max(b.width, b.height) - Math.max(a.width, a.height) }];
                let bestSolution = null; let bestEfficiency = -1;
                strategies.forEach(strat => {
                    let sortedRects = [...rawRects].sort(strat.sort);
                    let currentSheets = []; let remainingParts = [...sortedRects]; let sheetId = 1;
                    while (remainingParts.length > 0) {
                        const { placedParts, packedIndices } = packOneSheet(remainingParts, stockSize, bladeWidth, allowRotation);
                        if (placedParts.length === 0) break;
                        currentSheets.push({ id: sheetId++, parts: placedParts });
                        remainingParts = remainingParts.filter((_, i) => !packedIndices.has(i));
                    }
                    const totalArea = currentSheets.length * stockSize.w * stockSize.h;
                    const usedArea = currentSheets.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    const efficiency = totalArea > 0 ? usedArea / totalArea : 0;
                    if (efficiency > bestEfficiency) { bestEfficiency = efficiency; bestSolution = currentSheets; }
                });
                setSheetResults(bestSolution); 
                // Не трогаем results
                setOptimizationLog(`Оптимизация завершена. КПД: ${(bestEfficiency * 100).toFixed(1)}%`);
            };

            const packOneSheet = (remainingRects, stock, kerf, rotate) => {
                let freeRects = [{ x: 0, y: 0, w: stock.w, h: stock.h }];
                let placedParts = []; let packedIndices = new Set();
                const splitFreeRect = (free, placedX, placedY, placedW, placedH) => {
                    const newFree = [];
                    const rightX = placedX + placedW + kerf; const bottomY = placedY + placedH + kerf;
                    if (rightX < free.x + free.w) newFree.push({ x: rightX, y: free.y, w: free.x + free.w - rightX, h: free.h });
                    if (bottomY < free.y + free.h) newFree.push({ x: free.x, y: bottomY, w: Math.min(placedW, free.w), h: free.y + free.h - bottomY });
                    return newFree;
                };
                for (let i = 0; i < remainingRects.length; i++) {
                    if (packedIndices.has(i)) continue;
                    const part = remainingRects[i];
                    let bestScore = Infinity; let bestPlacement = null; let bestNewFree = null;
                    for (let f = 0; f < freeRects.length; f++) {
                        const free = freeRects[f];
                        if (part.width <= free.w && part.height <= free.h) {
                            const score = (free.w - part.width) * (free.h - part.height);
                            if (score < bestScore) { bestScore = score; bestPlacement = { rectIndex: f, rotated: false, x: free.x, y: free.y, w: part.width, h: part.height }; bestNewFree = splitFreeRect(free, free.x, free.y, part.width, part.height); }
                        }
                        if (rotate && part.height <= free.w && part.width <= free.h) {
                            const score = (free.w - part.height) * (free.h - part.width);
                            if (score < bestScore) { bestScore = score; bestPlacement = { rectIndex: f, rotated: true, x: free.x, y: free.y, w: part.height, h: part.width }; bestNewFree = splitFreeRect(free, free.x, free.y, part.height, part.width); }
                        }
                    }
                    if (bestPlacement) {
                        const { rectIndex, rotated, x, y, w, h } = bestPlacement;
                        placedParts.push({ ...part, x, y, currentW: w, currentH: h, rotated });
                        packedIndices.add(i);
                        freeRects.splice(rectIndex, 1); freeRects.push(...bestNewFree);
                        freeRects = freeRects.filter((a, idx) => {
                            if (a.w <= 0 || a.h <= 0) return false;
                            for (let j = 0; j < freeRects.length; j++) { if (j !== idx) { const b = freeRects[j]; if (a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h) return false; } }
                            return true;
                        });
                    }
                }
                return { placedParts, packedIndices };
            };

            const handleCalculate = () => { if (mode === 'linear') calculateLinear(); else calculateSheet(); };

            const stats = useMemo(() => {
                if (mode === 'linear' && results) {
                    const totalStock = results.length * stockLength; const used = results.reduce((acc, b) => acc + b.parts.reduce((pa, p) => pa + p.length, 0), 0); const wasteVal = totalStock - used; const efficiency = ((used / totalStock) * 100).toFixed(1); const totalCost = (totalStock / 1000) * materialPrice; const wasteCost = (wasteVal / 1000) * materialPrice;
                    return { totalItems: results.length, efficiency, waste: wasteVal.toFixed(0), unit: 'мм', areaUnit: 'м', totalCost: totalCost.toFixed(0), wasteCost: wasteCost.toFixed(0), hasPrice: materialPrice > 0 };
                } else if (mode === 'sheet' && sheetResults) {
                    const totalAreaMM = sheetResults.length * stockSize.w * stockSize.h; const usedAreaMM = sheetResults.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0); const efficiency = ((usedAreaMM / totalAreaMM) * 100).toFixed(1); const wasteAreaMM = totalAreaMM - usedAreaMM; const totalAreaM2 = totalAreaMM / 1000000; const wasteAreaM2 = wasteAreaMM / 1000000; const totalCost = totalAreaM2 * materialPrice; const wasteCost = wasteAreaM2 * materialPrice;
                    return { totalItems: sheetResults.length, efficiency, waste: wasteAreaM2.toFixed(3), unit: 'мм²', areaUnit: 'м²', totalCost: totalCost.toFixed(0), wasteCost: wasteCost.toFixed(0), hasPrice: materialPrice > 0 };
                }
                return null;
            }, [results, sheetResults, mode, stockLength, stockSize, materialPrice]);

            return (
                <div className="min-h-screen pb-10 flex flex-col bg-slate-50">

                                <div>
                                    <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">Кас Мастеръ</h1>

                                </div>
                            </div>
                            
                            {/* Переключатель режимов (Tabs) */}
                            <div className="bg-slate-100 p-1 rounded-lg flex shadow-inner">
                                <button onClick={() => setMode('linear')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'linear' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Scissors size={16} /> Линейный
                                </button>
                                <button onClick={() => setMode('sheet')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'sheet' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Layers size={16} /> Листовой
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow">
                        
                        {/* Левая колонка - Ввод данных */}
                        <div className="lg:col-span-1 space-y-6">
                            
                            {/* Карточка настроек материала */}
                            <div className="bg-surface rounded-xl shadow-card border border-slate-100 overflow-hidden">
                                <div className="p-4 bg-slate-50 border-b border-slate-100">
                                    <h2 className="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide">
                                        <Settings size={16} className="text-primary" /> Параметры заготовки
                                    </h2>
                                </div>
                                <div className="p-5 space-y-5">
                                    {mode === 'linear' ? (
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Длина хлыста (мм)</label>
                                            <input type="number" value={stockLength} onChange={(e) => setStockLength(Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all-custom"/>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Ширина</label>
                                                <input type="number" value={stockSize.w} onChange={(e) => setStockSize({...stockSize, w: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all-custom"/>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Высота</label>
                                                <input type="number" value={stockSize.h} onChange={(e) => setStockSize({...stockSize, h: Number(e.target.value)})} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all-custom"/>
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="grid grid-cols-2 gap-3 pt-2">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Пропил (мм)</label>
                                            <input type="number" value={bladeWidth} onChange={(e) => setBladeWidth(Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono text-slate-600 focus:outline-none focus:border-slate-400"/>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-emerald-600/80 uppercase mb-1 block">Цена {mode==='linear'?'/м':'/м²'}</label>
                                            <input type="number" value={materialPrice} onChange={(e) => setMaterialPrice(Number(e.target.value))} className="w-full bg-emerald-50/50 border border-emerald-100 rounded-lg px-3 py-2 text-sm font-mono text-emerald-700 placeholder-emerald-300/50 focus:outline-none focus:border-emerald-300" placeholder="0"/>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Карточка списка деталей */}
                            <div className="bg-surface rounded-xl shadow-card border border-slate-100 overflow-hidden flex flex-col h-[500px]">
                                <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide">
                                        <Grid size={16} className="text-primary" /> Список деталей
                                    </h2>
                                    <div className="flex flex-wrap gap-2 justify-end">
                                        {mode === 'sheet' && (
                                            <button onClick={() => setAllowRotation(!allowRotation)} className={`flex items-center gap-1 px-2 py-1.5 rounded-md border text-xs font-medium transition-all-custom ${allowRotation ? 'bg-primary/10 text-primary border-primary/20' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'}`} title={allowRotation ? "Вращение разрешено" : "Вращение запрещено"}>
                                                <RotateCcw size={14} />
                                                <span>{allowRotation ? 'Вращение: Да' : 'Вращение: Нет'}</span>
                                            </button>
                                        )}
                                        <button onClick={() => setShowImport(!showImport)} className={`flex items-center gap-1 px-2 py-1.5 rounded-md border text-xs font-medium transition-all-custom ${showImport ? 'bg-primary text-white border-primary' : 'bg-white text-slate-500 border-slate-200 hover:border-primary hover:text-primary'}`} title="Импорт">
                                            <FileText size={14} />
                                            <span>Импорт</span>
                                        </button>
                                        <button onClick={clearAllParts} disabled={parts.length === 0} className="flex items-center gap-1 px-2 py-1.5 rounded-md border border-slate-200 bg-white text-slate-400 hover:text-danger hover:border-danger disabled:opacity-50 disabled:hover:text-slate-400 disabled:hover:border-slate-200 transition-all-custom" title="Очистить все">
                                            <Trash2 size={14} />
                                            <span>Очистить</span>
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto p-4 bg-slate-50/30">
                                    {showImport ? (
                                        <div className="h-full flex flex-col animate-in fade-in zoom-in-95 duration-200">
                                            <div className="text-xs text-slate-500 mb-2 font-medium">Формат: {mode === 'linear' ? "Длина Количество" : "Ширина Высота Количество"}</div>
                                            <textarea className="w-full flex-grow p-3 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary mb-3 shadow-inner" placeholder={mode === 'linear' ? "1500 5\n2300 2" : "500 400 10\n1200 600 5"} value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                                            <button onClick={handleImport} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-medium shadow-sm transition-all-custom text-sm">Вставить данные</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {parts.length === 0 && (
                                                <div className="p-6 text-center border-2 border-dashed border-slate-200 rounded-lg bg-slate-50">
                                                     <h3 className="text-sm font-bold text-slate-700 mb-2">👋 С чего начать?</h3>
                                                     <ul className="text-xs text-slate-500 space-y-1 text-left inline-block">
                                                         <li>1. Укажите размеры заготовки (сверху слева).</li>
                                                         <li>2. Добавьте детали кнопкой <b>+</b> или через <b>Импорт</b>.</li>
                                                         <li>3. Нажмите кнопку <b>Рассчитать</b> внизу.</li>
                                                     </ul>
                                                </div>
                                            )}
                                            {parts.map((part) => (
                                                <div key={part.id} className="group relative bg-white p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-all-custom">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <input type="text" value={part.name} onChange={(e) => updatePart(part.id, 'name', e.target.value)} className="font-medium text-slate-700 w-full focus:outline-none focus:border-b border-primary/30 text-sm bg-transparent" placeholder="Название"/>
                                                        <button onClick={() => removePart(part.id)} className="text-slate-300 hover:text-danger ml-2"><Trash2 size={14} /></button>
                                                    </div>
                                                    <div className="flex gap-2 items-end">
                                                        {mode === 'linear' ? (
                                                            <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Длина</label><input type="number" value={part.length} onChange={(e) => updatePart(part.id, 'length', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono font-bold text-slate-700"/></div>

                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Ширина</label><input type="number" value={part.width} onChange={(e) => updatePart(part.id, 'width', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono font-bold text-slate-700"/></div>
                                                                <span className="pb-2 text-slate-300 text-xs">x</span>
                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Высота</label><input type="number" value={part.height} onChange={(e) => updatePart(part.id, 'height', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono font-bold text-slate-700"/></div>
                                                            </React.Fragment>
                                                        )}
                                                        <div className="w-16"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Кол-во</label><input type="number" value={part.quantity} onChange={(e) => updatePart(part.id, 'quantity', Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-mono text-center text-slate-700"/></div>
                                                    </div>
                                                    <div className={`absolute left-0 top-0 bottom-0 w-1.5 rounded-l-lg ${part.color}`}></div>
                                                </div>
                                            ))}
                                            <button onClick={addPart} className="w-full py-2 border-2 border-dashed border-slate-300 text-slate-500 rounded-lg hover:border-primary hover:text-primary hover:bg-primary/5 transition-all-custom text-sm font-medium flex justify-center items-center gap-1">
                                                <Plus size={16} /> Добавить строку
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 bg-white border-t border-slate-100 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                                    <button onClick={handleCalculate} disabled={parts.length === 0} className="w-full py-3.5 bg-primary hover:bg-primaryHover text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/30 active:transform active:scale-[0.98] transition-all-custom flex justify-center items-center gap-2 disabled:opacity-50 disabled:shadow-none">
                                        <Calculator size={20} /> Рассчитать раскрой
                                    </button>
                                </div>
                            </div>
                            
                            {/* Блок поддержки */}
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                                <p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">Поддержать проект</p>
                                <div className="flex flex-col items-center gap-2">
                                    <div className="p-2 bg-white rounded-lg border border-slate-100 shadow-sm">
                                        <img src="f72a202f-7469-4ccd-ae92-c126326506ca.jpg" alt="QR Code" className="w-24 h-24 object-contain opacity-90 hover:opacity-100 transition-opacity"/>
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Правая колонка - Результаты */}
                        <div className="lg:col-span-2 flex flex-col gap-6">
                            
                            <AdBlock id="R-A-12345-1" label="Верхний" />

                            {stats ? (
                                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    {/* Статистика (Карточки) */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-4 rounded-xl shadow-soft border border-slate-100">
                                            <div className="text-xs font-bold text-slate-400 uppercase mb-1">Всего {mode === 'linear' ? 'хлыстов' : 'листов'}</div>
                                            <div className="text-2xl font-bold text-slate-800">{stats.totalItems} <span className="text-sm font-normal text-slate-400">шт</span></div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl shadow-soft border border-slate-100">
                                            <div className="text-xs font-bold text-slate-400 uppercase mb-1">Полезный объем</div>
                                            <div className="text-2xl font-bold text-primary">{stats.efficiency}%</div>
                                        </div>
                                        {stats.hasPrice ? (
                                            <>
                                                <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                                    <div className="text-xs font-bold text-emerald-600 uppercase mb-1">Цена материала</div>
                                                    <div className="text-xl font-bold text-emerald-800 font-mono">{stats.totalCost} ₽</div>
                                                </div>
                                                <div className="bg-rose-50 p-4 rounded-xl border border-rose-100">
                                                    <div className="text-xs font-bold text-rose-600 uppercase mb-1">Цена отходов</div>
                                                    <div className="text-xl font-bold text-rose-800 font-mono">{stats.wasteCost} ₽</div>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <div className="bg-white p-4 rounded-xl shadow-soft border border-slate-100">
                                                     <div className="text-xs font-bold text-slate-400 uppercase mb-1">Общий расход</div>
                                                     <div className="text-2xl font-bold text-slate-800">{mode === 'linear' ? (stats.totalItems * stockLength / 1000).toFixed(1) : ((stats.totalItems * stockSize.w * stockSize.h) / 1000000).toFixed(2)} <span className="text-sm font-normal text-slate-400">{stats.areaUnit}</span></div>
                                                </div>
                                                <div className="bg-white p-4 rounded-xl shadow-soft border border-slate-100">
                                                    <div className="text-xs font-bold text-slate-400 uppercase mb-1">Отходы</div>
                                                    <div className="text-2xl font-bold text-rose-500">{stats.waste} <span className="text-sm font-normal text-slate-400">{mode === 'linear' ? 'мм' : 'м²'}</span></div>
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    {/* Центральная реклама */}
                                    <AdBlock id="R-A-12345-2" label="Центральный" />

                                    {/* Визуализация */}
                                    <div className="bg-white rounded-xl shadow-card border border-slate-200 overflow-hidden">
                                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                            <h3 className="font-bold text-slate-700">Карта раскроя</h3>
                                            <button onClick={() => window.print()} className="flex items-center gap-2 text-sm font-medium text-primary hover:text-primaryHover bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-primary/30 transition-all-custom shadow-sm"><Download size={16} /> Печать / PDF</button>
                                        </div>
                                        <div className="p-6 space-y-8 bg-slate-50/50">
                                            {mode === 'linear' && results && results.map((bar, index) => (
                                                <div key={bar.id} className="print-break-inside-avoid">
                                                    <div className="flex justify-between text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">

                                                        <span>Остаток: {bar.remaining} мм</span>
                                                    </div>
                                                    <div className="h-14 w-full bg-white rounded-lg border border-slate-300 relative flex overflow-hidden shadow-sm">
                                                        {bar.parts.map((part, pIndex) => (
                                                            <React.Fragment key={pIndex}>
                                                                <div className={`h-full ${part.color} border-r border-white/20 flex items-center justify-center relative group cursor-default hover:brightness-110 transition-all`} style={{ width: `${(part.length / stockLength) * 100}%` }}>
                                                                    <span className="text-white text-xs font-bold drop-shadow-md truncate px-1">{part.length}</span>
                                                                    <div className="absolute bottom-full mb-1 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded shadow-lg whitespace-nowrap z-10">{part.name}</div>
                                                                </div>
                                                                {pIndex < bar.parts.length - 1 && bladeWidth > 0 && (<div className="h-full bg-slate-400/50 w-px relative group" style={{ width: `${(bladeWidth / stockLength) * 100}%` }} title={`Рез ${bladeWidth}мм`}></div>)}
                                                            </React.Fragment>
                                                        ))}
                                                        <div className="h-full bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] bg-slate-100 flex-1 opacity-50" />
                                                    </div>
                                                </div>
                                            ))}
                                            
                                            {mode === 'sheet' && sheetResults && sheetResults.map((sheet, index) => (
                                                <div key={sheet.id} className="print-break-inside-avoid mb-8 last:mb-0">
                                                    <div className="flex justify-between items-center mb-2 px-1">
                                                        <span className="font-bold text-slate-700">Лист #{index + 1}</span>
                                                        <span className="text-xs font-mono text-slate-400 bg-white px-2 py-1 rounded border border-slate-200">{stockSize.w} x {stockSize.h}</span>
                                                    </div>
                                                    <div className="w-full bg-white border-2 border-slate-800 relative shadow-md overflow-hidden" style={{ aspectRatio: `${stockSize.w} / ${stockSize.h}` }}>
                                                        <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')]"></div>
                                                        {sheet.parts.map((part, pIndex) => (
                                                            <div key={pIndex} className={`absolute ${part.color} border border-slate-900/10 hover:border-white hover:z-10 group flex flex-col items-center justify-center text-white text-[10px] md:text-xs font-bold transition-all shadow-sm`} 
                                                                 style={{ left: `${(part.x / stockSize.w) * 100}%`, top: `${(part.y / stockSize.h) * 100}%`, width: `${(part.currentW / stockSize.w) * 100}%`, height: `${(part.currentH / stockSize.h) * 100}%` }}>
                                                                <span className="drop-shadow-md pointer-events-none truncate max-w-full px-1">{part.name}</span>
                                                                <div className="opacity-0 group-hover:opacity-100 absolute inset-0 bg-black/20 flex items-center justify-center transition-opacity">
                                                                    <span className="bg-black/70 px-1.5 py-0.5 rounded text-[9px] pointer-events-none whitespace-nowrap">{part.currentW}x{part.currentH}</span>
                                                                </div>
                                                                {part.rotated && <div className="absolute top-1 right-1 bg-black/30 rounded-full p-0.5"><RotateCcw size={8} /></div>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-12 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 min-h-[400px]">
                                    <div className="bg-white p-6 rounded-full mb-4 shadow-sm border border-slate-100">
                                        {mode === 'linear' ? <Scissors size={48} className="text-slate-300" /> : <Layers size={48} className="text-slate-300" />}
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-600 mb-2">Готов к расчету</h3>
                                    <p className="text-center max-w-xs text-sm text-slate-500">Заполните параметры слева и нажмите кнопку "Рассчитать раскрой"</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* SEO Блок внизу */}
                    <section className="max-w-6xl mx-auto px-4 pb-8 w-full print:hidden">
                        <SeoDescription />
                    </section>

                    {/* Подвал */}
                    <LegalFooter />
                    
                    {/* Скрипт для Kadam (внизу body) */}
                    <div className="thwsfd417206 w-full flex justify-center my-4 print:hidden"></div>
                </div>
            );
        };

        const StatCard = ({ label, value, unit, color = 'text-slate-900' }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200">
                <div className="text-xs text-slate-400 uppercase font-bold mb-1">{label}</div>
                <div className={'text-xl md:text-2xl font-bold font-mono ' + color}>{value} <span className="text-xs md:text-sm text-slate-400 font-normal ml-0.5">{unit}</span></div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CuttingOptimizer />);
    </script>

    <script>
        window.k_init = window.k_init || [];
         k_init.push({
        "id": "thwsfd417206",
        "type": "cu",
        "domain": "hdbkell.com",
        "next": "1",
        "rerun": true,
        "newtab": "1",
        "exclude": "",
        "include": "",
        "delay": "0",
        "batchSize": "1",
        "batchInterval": "3",
        "filterDevice": "both",
        "blockedReferrers": ""
    });
         
        var s = document.createElement('script');
        s.setAttribute('async', true);
        s.setAttribute('charset', 'utf-8');
        s.setAttribute('data-cfasync', false);
        s.src = 'https://hdbkell.com/2gcuz.js'; 
        document.head && document.head.appendChild(s);
    </script>
</body>
