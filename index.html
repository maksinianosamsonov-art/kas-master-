<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Кас Мастеръ - Калькулятор раскроя (Линейный и Листовой) Онлайн</title>
    <meta name="description" content="Бесплатный сервис для оптимизации раскроя профильной трубы, арматуры, ЛДСП и фанеры.">
    
    <meta name="yandex-verification" content="f820a1aef559942f" />
    <meta name="kadam-verification" content="kadam5bea9ce0a9f1c9bad43201c33cd9ffda" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryHover: '#1d4ed8',
                        secondary: '#f8fafc',
                        accent: '#10b981',
                        danger: '#ef4444',
                        surface: '#ffffff',
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)',
                    }
                }
            }
        }
    </script>
    
    <style>
        @media print {
            header, button, .no-print, .ad-banner, .seo-text, .thwsfd417206, .emhmqf417206 { display: none !important; }
            body { background: white; color: black; }
            .bg-slate-50 { background: white; }
            .shadow-soft, .shadow-card { box-shadow: none !important; }
            .bg-slate-900 { background: #333; color: white; }
            input { border: none; background: transparent; }
            .print-break-inside-avoid { page-break-inside: avoid; }
        }
        .prose h3 { margin-bottom: 0.5em; }
        .prose p { margin-bottom: 0.8em; }
        .bg-stripes {
            background-color: #f1f5f9;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent);
            background-size: 10px 10px;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ИКОНКИ ---
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Scissors = (p) => <IconWrapper {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></IconWrapper>;
        const Grid = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></IconWrapper>;
        const Layers = (p) => <IconWrapper {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
        const RotateCcw = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
        const Calculator = (p) => <IconWrapper {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>;
        const Download = (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;

        const SeoDescription = () => (
            <div className="seo-text mt-12 bg-white rounded-xl border border-slate-200 p-6 md:p-8 shadow-soft">
                <h3 className="text-xl font-bold text-slate-800 mb-4 text-center">Оптимизатор раскроя материалов «Кас Мастеръ»</h3>
                <div className="grid md:grid-cols-2 gap-8 text-sm text-slate-600 leading-relaxed">
                    <div className="prose">
                        <h4 className="font-bold text-slate-700 mb-2">Линейный раскрой (1D)</h4>
                        <p>Идеально подходит для погонажных материалов: трубы, арматура, брус. Помогает минимизировать остатки и сократить расходы.</p>
                    </div>
                    <div className="prose">
                        <h4 className="font-bold text-slate-700 mb-2">Листовой раскрой (2D)</h4>
                        <p>Оптимизация раскроя листовых материалов (ЛДСП, фанера, металл). Позволяет вращать детали для более плотной укладки.</p>
                    </div>
                </div>
            </div>
        );

        const LegalFooter = () => (
            <footer className="mt-12 border-t border-slate-200 pt-8 pb-12 bg-slate-50">
                <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-xs text-slate-400">
                    <div className="text-center md:text-left">
                        <p className="font-bold text-slate-500">&copy; 2026 Кас Мастеръ</p>
                        <p>Все расчеты выполняются локально в браузере.</p>
                    </div>
                    <div className="flex gap-6">
                        <a href="#" onClick={(e)=>{e.preventDefault(); alert("Все расчеты производятся локально.");}} className="hover:text-primary transition-colors underline">Конфиденциальность</a>
                    </div>
                </div>
                {/* --- СЮДА ВСТАВЛЕН DIV ДЛЯ СКРИПТА --- */}
                <div className="emhmqf417206"></div>
            </footer>
        );

        const StatCard = ({ label, value, unit, color = 'text-slate-900' }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-soft border border-slate-200 transition-all hover:shadow-md">
                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">{label}</div>
                <div className={`text-xl md:text-2xl font-bold font-mono ${color}`}>
                    {value} <span className="text-xs md:text-sm text-slate-400 font-normal ml-0.5">{unit}</span>
                </div>
            </div>
        );

        // --- ГЛАВНЫЙ КОМПОНЕНТ ---
        const App = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            const [linearParts, setLinearParts] = useState([]);
            const [sheetParts, setSheetParts] = useState([]);
            
            const parts = mode === 'linear' ? linearParts : sheetParts;
            const currentSetParts = (val) => mode === 'linear' ? setLinearParts(val) : setSheetParts(val);

            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            const handleNumberInput = (setter, value) => {
                setter(value === '' ? '' : Number(value));
            };

            const addPart = () => {
                const newId = Date.now() + Math.random(); 
                const newPart = { id: newId, name: `Деталь ${parts.length + 1}`, length: 1000, width: 400, height: 300, quantity: 1, color: colors[parts.length % colors.length] };
                currentSetParts([...parts, newPart]);
            };

            const clearAllParts = () => {
                if (parts.length === 0) return;
                if (window.confirm("Удалить все детали из текущего списка?")) {
                    currentSetParts([]);
                    if (mode === 'linear') setResults(null);
                    else setSheetResults(null);
                }
            };

            const removePart = (id) => currentSetParts(parts.filter(p => p.id !== id));
            const updatePart = (id, field, value) => currentSetParts(parts.map(p => p.id === id ? { ...p, [field]: value } : p));

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                const baseId = Date.now();
                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));
                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: baseId + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });
                if (newParts.length > 0) {
                    currentSetParts([...parts, ...newParts]);
                    setImportText('');
                    setShowImport(false);
                }
            };

            const handleCalculate = () => {
                if (mode === 'linear') {
                    let allPieces = [];
                    linearParts.forEach(p => { for (let i = 0; i < p.quantity; i++) allPieces.push({ ...p }); });
                    allPieces.sort((a, b) => b.length - a.length);
                    if (allPieces.some(p => p.length > stockLength)) { alert("Деталь длиннее заготовки!"); return; }
                    let bars = [];
                    allPieces.forEach(piece => {
                        let bestIdx = -1, minWaste = Infinity;
                        for (let i = 0; i < bars.length; i++) {
                            const needed = bars[i].parts.length > 0 ? piece.length + bladeWidth : piece.length;
                            if (bars[i].remaining >= needed && (bars[i].remaining - needed) < minWaste) { minWaste = bars[i].remaining - needed; bestIdx = i; }
                        }
                        if (bestIdx !== -1) {
                            const bar = bars[bestIdx];
                            const used = bar.parts.length === 0 ? piece.length : piece.length + bladeWidth;
                            bar.parts.push(piece); bar.remaining -= used;
                        } else {
                            bars.push({ id: bars.length + 1, parts: [piece], remaining: stockLength - piece.length });
                        }
                    });
                    setResults(bars); setOptimizationLog("Расчет завершен.");
                } else {
                    let rawRects = [];
                    sheetParts.forEach(p => { for (let i = 0; i < p.quantity; i++) rawRects.push({ ...p, uniqueId: `${p.id}-${i}` }); });
                    if (rawRects.some(p => Math.min(p.width, p.height) > Math.min(stockSize.w, stockSize.h) && Math.max(p.width, p.height) > Math.max(stockSize.w, stockSize.h))) { alert("Деталь больше листа!"); return; }
                    
                    const packOneSheet = (remainingRects, stock, kerf, rotate) => {
                        let freeRects = [{ x: 0, y: 0, w: stock.w, h: stock.h }];
                        let placedParts = []; let packedIndices = new Set();
                        const splitFreeRect = (free, px, py, pw, ph) => {
                            const newFree = [];
                            const rx = px + pw + kerf; const by = py + ph + kerf;
                            if (rx < free.x + free.w) newFree.push({ x: rx, y: free.y, w: free.x + free.w - rx, h: free.h });
                            if (by < free.y + free.h) newFree.push({ x: free.x, y: by, w: Math.min(pw, free.w), h: free.y + free.h - by });
                            return newFree;
                        };
                        for (let i = 0; i < remainingRects.length; i++) {
                            if (packedIndices.has(i)) continue;
                            const part = remainingRects[i];
                            let bestScore = Infinity, bestPlacement = null, bestNewFree = null;
                            for (let f = 0; f < freeRects.length; f++) {
                                const free = freeRects[f];
                                if (part.width <= free.w && part.height <= free.h) {
                                    const score = (free.w - part.width) * (free.h - part.height);
                                    if (score < bestScore) { bestScore = score; bestPlacement = { f, rotated: false, x: free.x, y: free.y, w: part.width, h: part.height }; bestNewFree = splitFreeRect(free, free.x, free.y, part.width, part.height); }
                                }
                                if (rotate && part.height <= free.w && part.width <= free.h) {
                                    const score = (free.w - part.height) * (free.h - part.width);
                                    if (score < bestScore) { bestScore = score; bestPlacement = { f, rotated: true, x: free.x, y: free.y, w: part.height, h: part.width }; bestNewFree = splitFreeRect(free, free.x, free.y, part.height, part.width); }
                                }
                            }
                            if (bestPlacement) {
                                const { f, rotated, x, y, w, h } = bestPlacement;
                                placedParts.push({ ...part, x, y, currentW: w, currentH: h, rotated });
                                packedIndices.add(i);
                                freeRects.splice(f, 1); freeRects.push(...bestNewFree);
                            }
                        }
                        return { placedParts, packedIndices };
                    };

                    let remaining = [...rawRects].sort((a,b) => (b.width * b.height) - (a.width * a.height));
                    let sheets = [];
                    while (remaining.length > 0) {
                        const { placedParts, packedIndices } = packOneSheet(remaining, stockSize, bladeWidth, allowRotation);
                        if (placedParts.length === 0) break;
                        sheets.push({ id: sheets.length + 1, parts: placedParts });
                        remaining = remaining.filter((_, i) => !packedIndices.has(i));
                    }
                    setSheetResults(sheets);
                    const totalArea = sheets.length * stockSize.w * stockSize.h;
                    const usedArea = sheets.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    setOptimizationLog(`Листовой расчет завершен. КПД: ${(usedArea / totalArea * 100).toFixed(1)}%`);
                }
            };

            const stats = useMemo(() => {
                if (mode === 'linear' && results) {
                    const totalStock = results.length * stockLength;
                    const used = results.reduce((acc, b) => acc + b.parts.reduce((pa, p) => pa + p.length, 0), 0);
                    const efficiency = ((used / totalStock) * 100).toFixed(1);
                    return { totalItems: results.length, efficiency, waste: (totalStock - used).toFixed(0), unit: 'мм', areaUnit: 'м', totalCost: (totalStock / 1000 * materialPrice).toFixed(0), wasteCost: ((totalStock - used) / 1000 * materialPrice).toFixed(0), hasPrice: materialPrice > 0 };
                } else if (mode === 'sheet' && sheetResults) {
                    const totalAreaMM = sheetResults.length * stockSize.w * stockSize.h;
                    const usedAreaMM = sheetResults.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    const efficiency = ((usedAreaMM / totalAreaMM) * 100).toFixed(1);
                    return { totalItems: sheetResults.length, efficiency, waste: ((totalAreaMM - usedAreaMM) / 1000000).toFixed(3), unit: 'мм²', areaUnit: 'м²', totalCost: (totalAreaMM / 1000000 * materialPrice).toFixed(0), wasteCost: ((totalAreaMM - usedAreaMM) / 1000000 * materialPrice).toFixed(0), hasPrice: materialPrice > 0 };
                }
                return null;
            }, [results, sheetResults, mode, stockLength, stockSize, materialPrice]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Header */}
                    <header className="bg-white shadow-soft sticky top-0 z-20 print:hidden border-b border-slate-100">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">Кас Мастеръ</h1>
                                <p className="text-xs text-slate-500 font-medium tracking-wide">Универсальный калькулятор раскроя</p>
                            </div>
                            <div className="bg-slate-100 p-1 rounded-lg flex shadow-inner">
                                <button onClick={() => { setMode('linear'); setOptimizationLog(''); }} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'linear' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Scissors size={16} /> Линейный
                                </button>
                                <button onClick={() => { setMode('sheet'); setOptimizationLog(''); }} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all-custom ${mode === 'sheet' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Layers size={16} /> Листовой
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow items-start">
                        {/* Левая панель */}
                        <div className="lg:col-span-1 space-y-6">
                            <div className="card-custom overflow-hidden">
                                <div className="p-4 bg-slate-50 border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide">
                                    <Settings size={16} className="text-primary" /> Параметры заготовки
                                </div>
                                <div className="p-5 space-y-5">
                                    {mode === 'linear' ? (
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Длина хлыста (мм)</label>
                                            <input type="number" value={stockLength} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setStockLength, e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Ширина</label>
                                                <input type="number" value={stockSize.w} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput((v) => setStockSize(s => ({...s, w: v})), e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Высота</label>
                                                <input type="number" value={stockSize.h} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput((v) => setStockSize(s => ({...s, h: v})), e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-lg font-mono font-bold focus:ring-2 focus:ring-primary/20 outline-none transition-all-custom"/>
                                            </div>
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-3 pt-2">
                                        <div><label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Пропил (мм)</label><input type="number" value={bladeWidth} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setBladeWidth, e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono outline-none"/></div>
                                        <div><label className="text-xs font-bold text-emerald-600 uppercase mb-1 block">Цена за ед.</label><input type="number" value={materialPrice} onFocus={(e) => e.target.select()} onChange={(e) => handleNumberInput(setMaterialPrice, e.target.value)} className="w-full bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2 text-sm font-mono outline-none" placeholder="0"/></div>
                                    </div>
                                </div>
                            </div>

                            <div className="card-custom flex flex-col min-h-[500px] overflow-hidden">
                                <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide"><Grid size={16} className="text-primary" /> Детали</h2>
                                    <button onClick={clearAllParts} disabled={parts.length === 0} className="p-2 rounded-md border border-slate-200 bg-white text-slate-400 hover:text-danger hover:border-danger disabled:opacity-30 transition-all-custom font-bold text-[10px] flex items-center gap-1 uppercase tracking-tighter shadow-sm"><Trash2 size={12}/> Очистить всё</button>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto p-4 space-y-4">
                                    <div className="flex gap-2">
                                        {mode === 'sheet' && (
                                            <button onClick={() => setAllowRotation(!allowRotation)} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg border text-[10px] font-bold transition-all-custom shadow-sm ${allowRotation ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}`}><RotateCcw size={14} /> Вращение разрешено</button>
                                        )}
                                        <button onClick={() => setShowImport(!showImport)} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg border text-[10px] font-bold transition-all-custom shadow-sm ${showImport ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-primary/30'}`}><FileText size={14} /> Импорт данных</button>
                                    </div>
                                    
                                    {showImport ? (
                                        <div className="h-64 flex flex-col animate-in fade-in duration-300">
                                            <textarea className="w-full flex-grow p-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-primary/20 outline-none mb-3 shadow-inner" placeholder={mode === 'linear' ? "Длина Количество (например: 1500 5)" : "Ширина Высота (например: 500 400)"} value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                                            <button onClick={handleImport} className="w-full py-2.5 bg-slate-800 text-white rounded-lg font-bold text-sm shadow-md transition-all-custom active:scale-95">Добавить из текста</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 pb-4">
                                            {parts.length === 0 && (
                                                <div className="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50">
                                                     <h3 className="text-sm font-bold text-slate-700 mb-2">👋 С чего начать?</h3>
                                                     <ul className="text-xs text-slate-500 space-y-2 text-left inline-block">
                                                         <li>1. Укажите размеры <b>Заготовки</b>.</li>
                                                         <li>2. Нажмите <b>Добавить деталь</b> или <b>Импорт</b>.</li>
                                                         <li>3. Нажмите кнопку <b>Рассчитать</b> внизу.</li>
                                                     </ul>
                                                </div>
                                            )}
                                            {parts.map((part) => (
                                                <div key={part.id} className="group relative bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all-custom">
                                                    <div className="flex justify-between items-start mb-2"><input type="text" value={part.name} onChange={(e) => updatePart(part.id, 'name', e.target.value)} className="font-bold text-slate-700 w-full focus:outline-none text-sm bg-transparent" placeholder="Название"/><button onClick={() => removePart(part.id)} className="text-slate-300 hover:text-danger ml-2 transition-colors"><Trash2 size={14} /></button></div>
                                                    <div className="flex gap-2 items-end">
                                                        {mode === 'linear' ? (
                                                            <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Длина</label><input type="number" value={part.length} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'length', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                        ) : (
                                                            <React.Fragment>
                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Шир.</label><input type="number" value={part.width} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'width', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                                <div className="flex-1"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Выс.</label><input type="number" value={part.height} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'height', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono font-bold"/></div>
                                                            </React.Fragment>
                                                        )}
                                                        <div className="w-16"><label className="text-[9px] uppercase text-slate-400 font-bold block mb-0.5">Кол-во</label><input type="number" value={part.quantity} onFocus={(e) => e.target.select()} onChange={(e) => updatePart(part.id, 'quantity', e.target.value === '' ? '' : Number(e.target.value))} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-mono text-center font-bold"/></div>
                                                    </div>
                                                    <div className={`absolute left-0 top-0 bottom-0 w-1.5 rounded-l-xl ${part.color}`}></div>
                                                </div>
                                            ))}
                                            <button onClick={addPart} className="w-full py-3 border-2 border-dashed border-slate-300 text-slate-500 rounded-xl hover:border-primary hover:text-primary hover:bg-primary/5 transition-all-custom text-sm font-bold flex justify-center items-center gap-1 shadow-sm"><Plus size={16} /> Добавить деталь</button>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="p-4 bg-white border-t border-slate-100 shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)] shrink-0">
                                    <button onClick={handleCalculate} disabled={parts.length === 0} className="w-full py-4 bg-primary hover:bg-primaryHover text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/30 flex justify-center items-center gap-2 transition-all-custom active:scale-[0.98] disabled:opacity-50">
                                        <Calculator size={22} /> Рассчитать раскрой
                                    </button>
                                </div>
                            </div>
                            
                            <div className="card-custom p-4 text-center">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Поддержать проект</p>
                                <div className="flex justify-center">
                                    <img src="f72a202f-7469-4ccd-ae92-c126326506ca.jpg" alt="QR Code" className="w-28 h-28 object-contain rounded-lg shadow-sm border border-slate-100"/>
                                </div>
                            </div>
                        </div>

                        {/* Правая панель */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {stats ? (
                                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <StatCard label="Заготовок" value={stats.totalItems} unit="шт" />
                                        <StatCard label="КПД" value={stats.efficiency} unit="%" color="text-primary" />
                                        {stats.hasPrice && (
                                            <React.Fragment>
                                                <StatCard label="Сумма" value={stats.totalCost} unit="₽" color="text-emerald-600" />
                                                <StatCard label="Потери" value={stats.wasteCost} unit="₽" color="text-rose-500" />
                                            </React.Fragment>
                                        )}
                                    </div>
                                    
                                    <div className="card-custom overflow-hidden">
                                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 font-bold text-slate-700 text-[10px] uppercase tracking-widest">
                                            Карта раскроя
                                            <button onClick={() => window.print()} className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm text-primary flex items-center gap-2 transition-all-custom hover:bg-slate-50 active:scale-95">
                                                <Download size={14} /> Печать / PDF
                                            </button>
                                        </div>
                                        <div className="p-6 space-y-8 bg-slate-50/50 min-h-[400px]">
                                            {optimizationLog && <div className="text-[10px] font-mono text-slate-400 border-b border-slate-200 pb-2 mb-4 uppercase tracking-tighter">{optimizationLog}</div>}
                                            
                                            {mode === 'linear' && results && results.map((bar, index) => (
                                                <div key={index} className="print-break-inside-avoid">
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span>Заготовка #{index + 1}</span><span>Остаток: {bar.remaining} мм</span></div>
                                                    <div className="h-14 w-full bg-white rounded-lg border border-slate-300 relative flex overflow-hidden shadow-sm">
                                                        {bar.parts.map((p, pi) => (
                                                            <React.Fragment key={pi}>
                                                                <div className={`h-full ${p.color} border-r border-white/20 flex items-center justify-center text-white text-[10px] font-bold transition-all hover:brightness-110`} style={{ width: `${(p.length / stockLength) * 100}%` }}>{p.length}</div>
                                                                {pi < bar.parts.length - 1 && bladeWidth > 0 && (<div className="h-full bg-slate-300" style={{ width: `${(bladeWidth / stockLength) * 100}%` }}></div>)}
                                                            </React.Fragment>
                                                        ))}
                                                        <div className="h-full bg-stripes flex-1 opacity-50" />
                                                    </div>
                                                </div>
                                            ))}
                                            
                                            {mode === 'sheet' && sheetResults && sheetResults.map((sheet, index) => (
                                                <div key={index} className="print-break-inside-avoid mb-8 last:mb-0">
                                                    <div className="flex justify-between items-center mb-2 px-1 font-bold text-slate-700 text-sm">Лист #{index + 1}<span className="text-[10px] font-mono text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200 uppercase tracking-tighter">{stockSize.w} x {stockSize.h}</span></div>
                                                    <div className="w-full bg-white border-2 border-slate-800 relative shadow-md overflow-hidden" style={{ aspectRatio: `${stockSize.w} / ${stockSize.h}` }}>
                                                        <div className="absolute inset-0 bg-stripes opacity-10"></div>
                                                        {sheet.parts.map((p, pi) => (
                                                            <div key={pi} className={`absolute ${p.color} border border-slate-900/10 hover:border-white hover:z-10 group flex flex-col items-center justify-center text-white text-[8px] md:text-[10px] font-bold transition-all shadow-sm`} style={{ left: `${(p.x / stockSize.w) * 100}%`, top: `${(p.y / stockSize.h) * 100}%`, width: `${(p.currentW / stockSize.w) * 100}%`, height: `${(p.currentH / stockSize.h) * 100}%` }}>
                                                                <span className="drop-shadow-md pointer-events-none truncate max-w-full px-0.5">{p.name}</span>
                                                                <div className="opacity-0 group-hover:opacity-100 absolute inset-0 bg-black/20 flex items-center justify-center transition-opacity pointer-events-none">
                                                                    <span className="bg-black/70 px-1 py-0.5 rounded text-[8px] whitespace-nowrap">{p.currentW}x{p.currentH}</span>
                                                                </div>
                                                                {p.rotated && <div className="absolute top-0.5 right-0.5 bg-black/30 rounded-full p-0.5"><RotateCcw size={8} /></div>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-12 border-2 border-dashed border-slate-200 rounded-3xl bg-white min-h-[500px] shadow-soft">
                                    <div className="bg-slate-100 p-6 rounded-full mb-6 shadow-sm border border-slate-100">
                                        {mode === 'linear' ? <Scissors size={48} className="text-slate-300" /> : <Layers size={48} className="text-slate-300" />}
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-600 mb-2 tracking-tight uppercase tracking-widest text-[12px]">Готов к расчету</h3>
                                    <p className="text-center max-w-xs text-sm text-slate-500 leading-relaxed">Заполните параметры материала слева и нажмите кнопку «Рассчитать раскрой»</p>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    <section className="max-w-6xl mx-auto px-4 pb-8 w-full print:hidden">
                        <SeoDescription />
                    </section>
                    
                    <LegalFooter />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
