    <meta name="description" content="Бесплатный онлайн сервис для оптимизации раскроя ЛДСП, металла, трубы. Карты раскроя, расчет стоимости, учет остатков. Без регистрации.">
    <meta name="keywords" content="карта раскроя, раскрой онлайн, калькулятор лдсп, линейный раскрой, программа раскроя, Кас Мастер">
    <meta name="author" content="Иголкин М.А.">

<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- КОМПОНЕНТ РЕКЛАМЫ ---
        // Когда подключишь РСЯ, код нужно будет вставить внутрь этого div
        const AdBlock = ({ id, label }) => (
            <div className="ad-container w-full my-4 p-4 bg-slate-100 border border-slate-300 border-dashed rounded-lg flex flex-col items-center justify-center text-slate-400 min-h-[150px]">
                <span className="text-xs uppercase font-bold mb-2 tracking-wider">Реклама</span>
                <div id={`yandex_rtb_${id}`} className="text-center text-sm">
                    {/* Сюда вставится реклама автоматически, а пока заглушка: */}
                    Место для баннера<br/>(Блок {label})
                </div>
            </div>
        );

        // --- ИКОНКИ ---
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Scissors = (p) => <IconWrapper {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></IconWrapper>;
        const Grid = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></IconWrapper>;
        const Layers = (p) => <IconWrapper {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
        const RotateCcw = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
        const Calculator = (p) => <IconWrapper {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>;
        const Download = (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;
        
        // --- ОСНОВНОЙ КОМПОНЕНТ ---
        const CuttingOptimizer = () => {
            const [mode, setMode] = useState('linear'); 
            const [stockLength, setStockLength] = useState(6000);
            const [stockSize, setStockSize] = useState({ w: 2500, h: 1250 });
            const [allowRotation, setAllowRotation] = useState(true);
            const [bladeWidth, setBladeWidth] = useState(3);
            const [materialPrice, setMaterialPrice] = useState(0); 
            
            const [parts, setParts] = useState([
                { id: 1, name: 'Деталь A', length: 2400, width: 500, height: 400, quantity: 4, color: 'bg-blue-500' },
                { id: 2, name: 'Деталь B', length: 850, width: 800, height: 600, quantity: 6, color: 'bg-emerald-500' },
            ]);
            const [results, setResults] = useState(null);
            const [sheetResults, setSheetResults] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [optimizationLog, setOptimizationLog] = useState('');

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500', 'bg-lime-600', 'bg-fuchsia-600'];

            const addPart = () => {
                const newId = parts.length > 0 ? Math.max(...parts.map(p => p.id)) + 1 : 1;
                setParts([...parts, { id: newId, name: `Деталь ${newId}`, length: 1000, width: 400, height: 300, quantity: 1, color: colors[newId % colors.length] }]);
            };

            const clearAllParts = () => {
                if (parts.length > 0 && window.confirm("Вы действительно хотите удалить все детали?")) {
                    setParts([]);
                }
            };

            const removePart = (id) => setParts(parts.filter(p => p.id !== id));
            const updatePart = (id, field, value) => setParts(parts.map(p => p.id === id ? { ...p, [field]: value } : p));

            const handleImport = () => {
                const lines = importText.trim().split(/\r?\n/);
                const newParts = [];
                let currentMaxId = parts.length > 0 ? Math.max(...parts.map(p => p.id)) : 0;

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const tokens = line.trim().replace(/,/g, '.').split(/[\t\s,;]+/);
                    const nums = tokens.map(Number).filter(n => !isNaN(n));

                    if (mode === 'linear' && nums.length >= 1) {
                        newParts.push({ id: currentMaxId + 1 + index, name: `Импорт ${index + 1}`, length: nums[0], width: 0, height: 0, quantity: nums[1] || 1, color: colors[(parts.length + index) % colors.length] });
                    } else if (mode === 'sheet' && nums.length >= 2) {
                        newParts.push({ id: currentMaxId + 1 + index, name: `Импорт ${index + 1}`, length: 0, width: nums[0], height: nums[1], quantity: nums[2] || 1, color: colors[(parts.length + index) % colors.length] });
                    }
                });

                if (newParts.length > 0) {
                    setParts([...parts, ...newParts]);
                    setImportText('');
                    setShowImport(false);
                } else {
                    alert('Не удалось распознать данные. Проверьте формат.');
                }
            };

            const calculateLinear = () => {
                let allPieces = [];
                parts.forEach(part => { for (let i = 0; i < part.quantity; i++) allPieces.push({ ...part }); });
                allPieces.sort((a, b) => b.length - a.length);
                if (allPieces.some(p => p.length > stockLength)) { alert("Ошибка: Деталь длиннее заготовки!"); return; }
                let bars = [];
                allPieces.forEach(piece => {
                    let bestBarIndex = -1;
                    let minWaste = Infinity;
                    for (let i = 0; i < bars.length; i++) {
                        const neededSpace = bars[i].parts.length > 0 ? piece.length + bladeWidth : piece.length;
                        if (bars[i].remaining >= neededSpace) {
                            const waste = bars[i].remaining - neededSpace;
                            if (waste < minWaste) { minWaste = waste; bestBarIndex = i; }
                        }
                    }
                    if (bestBarIndex !== -1) {
                        const bar = bars[bestBarIndex];
                        const isFirst = bar.parts.length === 0;
                        const used = isFirst ? piece.length : piece.length + bladeWidth;
                        bar.parts.push(piece);
                        bar.remaining -= used;
                        bar.usedLength += used;
                    } else {
                        bars.push({ id: bars.length + 1, parts: [piece], remaining: stockLength - piece.length, usedLength: piece.length, totalLength: stockLength });
                    }
                });
                setResults(bars);
                setSheetResults(null);
                setOptimizationLog("Использован алгоритм First Fit Decreasing (FFD). Оптимален для одномерных задач.");
            };

            const calculateSheet = () => {
                let rawRects = [];
                parts.forEach(part => { 
                    for (let i = 0; i < part.quantity; i++) { 
                        rawRects.push({ ...part, uniqueId: `${part.id}-${i}` }); 
                    } 
                });

                if (rawRects.some(p => Math.min(p.width, p.height) > Math.min(stockSize.w, stockSize.h) && Math.max(p.width, p.height) > Math.max(stockSize.w, stockSize.h))) { 
                    alert("Ошибка: Деталь больше размера листа!"); return; 
                }
                
                const strategies = [
                    { name: "По площади (Area Desc)", sort: (a, b) => (b.width * b.height) - (a.width * a.height) },
                    { name: "По длинной стороне (Max Side)", sort: (a, b) => Math.max(b.width, b.height) - Math.max(a.width, a.height) },
                    { name: "По короткой стороне (Min Side)", sort: (a, b) => Math.min(b.width, b.height) - Math.min(a.width, a.height) },
                    { name: "По ширине (Width)", sort: (a, b) => b.width - a.width }
                ];

                let bestSolution = null;
                let bestEfficiency = -1;
                let logMessage = "Сравнение стратегий:\n";

                strategies.forEach(strat => {
                    let sortedRects = [...rawRects].sort(strat.sort);
                    let currentSheets = [];
                    let remainingParts = [...sortedRects];
                    let sheetId = 1;

                    while (remainingParts.length > 0) {
                        const { placedParts, packedIndices } = packOneSheet(remainingParts, stockSize, bladeWidth, allowRotation);
                        if (placedParts.length === 0) break;
                        currentSheets.push({ id: sheetId++, parts: placedParts });
                        remainingParts = remainingParts.filter((_, i) => !packedIndices.has(i));
                    }

                    const totalArea = currentSheets.length * stockSize.w * stockSize.h;
                    const usedArea = currentSheets.reduce((acc, s) => acc + s.parts.reduce((pa, p) => pa + (p.width * p.height), 0), 0);
                    const efficiency = totalArea > 0 ? usedArea / totalArea : 0;

                    logMessage += `- ${strat.name}: ${currentSheets.length} листов, КПД ${(efficiency * 100).toFixed(1)}%\n`;

                    if (efficiency > bestEfficiency) {
                        bestEfficiency = efficiency;
                        bestSolution = currentSheets;
                    }
                });

                setSheetResults(bestSolution);
                setResults(null);
                setOptimizationLog(logMessage + `\n>> Выбран лучший вариант (КПД ${(bestEfficiency * 100).toFixed(1)}%)`);
            };

            const packOneSheet = (remainingRects, stock, kerf, rotate) => {
                let freeRects = [{ x: 0, y: 0, w: stock.w, h: stock.h }];
                let placedParts = [];
                let packedIndices = new Set();

                const splitFreeRect = (free, placedX, placedY, placedW, placedH) => {
                    const newFree = [];
                    const rightX = placedX + placedW + kerf;
                    const bottomY = placedY + placedH + kerf;
                    if (rightX < free.x + free.w) {
                        newFree.push({ x: rightX, y: free.y, w: free.x + free.w - rightX, h: free.h });
                    }
                    if (bottomY < free.y + free.h) {
                        newFree.push({ x: free.x, y: bottomY, w: Math.min(placedW, free.w), h: free.y + free.h - bottomY });
                    }
                    return newFree;
                };

                for (let i = 0; i < remainingRects.length; i++) {
                    if (packedIndices.has(i)) continue;
                    const part = remainingRects[i];
                    let bestScore = Infinity;
                    let bestPlacement = null;
                    let bestNewFree = null;

                    for (let f = 0; f < freeRects.length; f++) {
                        const free = freeRects[f];
                        if (part.width <= free.w && part.height <= free.h) {
                            const score = (free.w - part.width) * (free.h - part.height);
                            if (score < bestScore) {
                                bestScore = score;
                                bestPlacement = { rectIndex: f, rotated: false, x: free.x, y: free.y, w: part.width, h: part.height };
                                bestNewFree = splitFreeRect(free, free.x, free.y, part.width, part.height);
                            }
                        }
                        if (rotate && part.height <= free.w && part.width <= free.h) {
                            const score = (free.w - part.height) * (free.h - part.width);
                            if (score < bestScore) {
                                bestScore = score;
                                bestPlacement = { rectIndex: f, rotated: true, x: free.x, y: free.y, w: part.height, h: part.width };
                                bestNewFree = splitFreeRect(free, free.x, free.y, part.height, part.width);
                            }
                        }
                    }

                    if (bestPlacement) {
                        const { rectIndex, rotated, x, y, w, h } = bestPlacement;
                        placedParts.push({ ...part, x, y, currentW: w, currentH: h, rotated });
                        packedIndices.add(i);
                        freeRects.splice(rectIndex, 1);
                        freeRects.push(...bestNewFree);
                        freeRects = freeRects.filter((a, idx) => {
                            if (a.w <= 0 || a.h <= 0) return false;
                            for (let j = 0; j < freeRects.length; j++) {
                                if (j !== idx) {
                                    const b = freeRects[j];
                                    if (a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h) return false;
                                }
                            }
                            return true;
                        });
                    }
                }
                return { placedParts, packedIndices };
            };

            const handleCalculate = () => { if (mode === 'linear') calculateLinear(); else calculateSheet(); };

            const stats = useMemo(() => {
                if (mode === 'linear' && results) {
                    const totalStock = results.length * stockLength;
                    const used = results.reduce((acc, b) => acc + b.parts.reduce((pa, p) => pa + p.length, 0), 0);
                    const wasteVal = totalStock - used;
                    const efficiency = ((used / totalStock) * 100).toFixed(1);
                    const totalCost = (totalStock / 1000) * materialPrice;
                    const wasteCost = (wasteVal / 1000) * materialPrice;
                    return { totalItems: results.length, efficiency, waste: wasteVal.toFixed(0), unit: 'мм', areaUnit: 'м', totalCost: totalCost.toFixed(0), wasteCost: wasteCost.toFixed(0), hasPrice: materialPrice > 0 };
                } else if (mode === 'sheet' && sheetResults) {
                    const totalAreaMM = sheetResults.length * stockSize.w * stockSize.h;
